[project]
name = "threadnote-recall-reranker-training"
version = "0.1.0"
description = "Non-shipping training and evaluation harness for Threadnote's recall reranker"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "accelerate==1.15.0",
  "datasets==5.1.0",
  "huggingface-hub==1.33.0",
  "sentence-transformers==6.1.0",
  "torch==2.14.1",
  "transformers==5.19.0",
]

[project.scripts]
threadnote-reranker = "threadnote_reranker_training.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threadnote_reranker_training"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
package = true
