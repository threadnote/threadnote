name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/4.0.0, release/5.0.0, release/5.1.0]
  workflow_dispatch:
    inputs:
      native_workflow_stress:
        description: Run the manual native workflow qualification tier
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# A newer push to a pull request supersedes its older run; main and manual runs always finish.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.4

jobs:
  # Registered CI can dispatch a branch's same-commit manual tier before the new workflow reaches default.
  native-workflow-stress:
    if: github.event_name == 'workflow_dispatch' && inputs.native_workflow_stress == true
    uses: ./.github/workflows/native-workflow-stress.yml

  bazel-plan:
    name: Plan affected Bazel checks
    if: github.event_name != 'workflow_dispatch' || inputs.native_workflow_stress != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      bazel_validation: ${{ steps.selection.outputs.bazel_validation }}
      compile_targets: ${{ steps.selection.outputs.compile_targets }}
      execute_bazel: ${{ steps.shards.outputs.execute_bazel }}
      manager_e2e: ${{ steps.selection.outputs.manager_e2e }}
      native_typescript: ${{ steps.shards.outputs.native_typescript }}
      recall_quality: ${{ steps.selection.outputs.recall_quality }}
      release_matrix: ${{ steps.selection.outputs.release_matrix }}
      shard_matrix: ${{ steps.shards.outputs.matrix }}
      workflow_validation: ${{ steps.selection.outputs.workflow_validation }}
      windows_smoke: ${{ steps.selection.outputs.windows_smoke }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile

      - name: Verify native release matrix coverage
        run: >-
          bun --eval 'import {BUN_STANDALONE_TARGETS} from "./scripts/release-targets.ts";
          import {parse} from "yaml";
          const workflow=parse(await Bun.file(".github/workflows/ci.yml").text());
          const smoke=Object.values(workflow.jobs).filter(job=>job.uses==="./.github/workflows/native-release-smoke.yml");
          const rows=smoke.flatMap(job=>job.strategy?.matrix?.include??[{target:job.with?.target}]);
          if(rows.some(row=>typeof row.target!=="string"||row.target.includes("{{")))throw new Error("Every native release leg must name a literal target");
          const targets=rows.map(row=>"bun-"+(row.target==="linux-x64"?"linux-x64-baseline":row.target==="linux-x64-musl"?"linux-x64-baseline-musl":row.target==="windows-x64"?"windows-x64-baseline":row.target));
          if(targets.length!==BUN_STANDALONE_TARGETS.length||new Set(targets).size!==targets.length||BUN_STANDALONE_TARGETS.some(target=>!targets.includes(target)))throw new Error("Native execution matrix must cover the exact release target definitions");'

      - id: selection
        name: Select affected Bazel targets
        env:
          # A manual qualification run on 6.0.0 selects the full inventory.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || (github.ref_name == '6.0.0' && '0000000000000000000000000000000000000000' || 'origin/main') }}
        run: bun tools/ci/bazel-select.mjs --base "$BASE_SHA"

      - id: shards
        name: Plan parallel Bazel shards
        run: bun tools/ci/bazel-plan-shards.mjs

      - name: Record authoritative selection
        if: always()
        run: |
          if [ -f .context/bazel-selection/selection.json ]; then
            {
              echo '### Bazel CI selection'
              echo '```json'
              cat .context/bazel-selection/selection.json
              echo '```'
              if [ -f .context/bazel-selection/shards.json ]; then
                echo '### Parallel Bazel shards'
                echo '```json'
                cat .context/bazel-selection/shards.json
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bazel-selection
          path: .context/bazel-selection/
          include-hidden-files: true

  bazel-plan-validation:
    name: Validate Bazel selection
    needs: bazel-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate GitHub Actions workflows
        if: needs.bazel-plan.outputs.workflow_validation == 'true'
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      - uses: oven-sh/setup-bun@v2
        if: needs.bazel-plan.outputs.bazel_validation == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frozen workspace dependencies
        if: needs.bazel-plan.outputs.bazel_validation == 'true'
        run: bun install --frozen-lockfile

      - name: Prepare Bazel workspace
        if: needs.bazel-plan.outputs.bazel_validation == 'true'
        run: bun tools/bazel/prepare.mjs

      - name: Verify generated Bazel declarations
        if: needs.bazel-plan.outputs.bazel_validation == 'true'
        run: bun tools/bazel/generate.mjs --check

      - name: Verify Bazel selection edge cases
        if: needs.bazel-plan.outputs.bazel_validation == 'true'
        run: bun tools/bazel/verify-selection.mjs

  # One shared prepared-asset job per reviewed-pin host: restore, construct once on a miss, save. Consumers below only
  # restore it (a miss fails them) and so never build the asset inside their own, shorter job budgets.
  native-typescript-asset:
    name: Native TypeScript asset · linux-x64
    needs: bazel-plan
    if: >-
      needs.bazel-plan.outputs.native_typescript == 'true' || needs.bazel-plan.outputs.recall_quality == 'true' ||
      needs.bazel-plan.outputs.release_matrix == 'true' || needs.bazel-plan.outputs.manager_e2e == 'true' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == '6.0.0' &&
      github.base_ref == 'main')
    # Every consumer runs on this exact image and restores by this job's cache_key output, never a key it re-derives.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      cache_key: ${{ steps.asset.outputs.cache_key }}
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile
      - name: Restore, construct on a miss and save the verified native TypeScript asset
        id: asset
        timeout-minutes: 80
        uses: ./.github/actions/native-typescript-asset

  p11-linux-read-pilot:
    name: P11 Linux x64 read pilot
    needs: native-typescript-asset
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == '6.0.0' &&
      github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile
      - name: Restore the verified native TypeScript asset
        id: native-asset
        timeout-minutes: 8
        uses: ./.github/actions/native-typescript-asset
        with:
          restore-only: 'true'
          cache-key: ${{ needs.native-typescript-asset.outputs.cache_key }}
      - name: Run exact-head partial read fixtures
        timeout-minutes: 15
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          ASSET_HEAD: ${{ needs.native-typescript-asset.outputs.ref }}
          THREADNOTE_TYPESCRIPT_NATIVE_ASSET_DIR: ${{ steps.native-asset.outputs.payload }}
        run: bash tools/ci/p11-linux-read-pilot.sh
      - name: Upload the bounded read pilot summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p11-linux-x64-read-pilot
          path: ${{ runner.temp }}/threadnote-p11-linux-read.json
          if-no-files-found: ignore

  # One job per release host (not a matrix) so each job exposes its own cache_key and only its own release leg needs it.
  native-typescript-asset-linux-arm64:
    name: Native TypeScript asset · linux-arm64
    needs: bazel-plan
    if: needs.bazel-plan.outputs.release_matrix == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    outputs:
      cache_key: ${{ steps.asset.outputs.cache_key }}
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile
      - name: Restore, construct on a miss and save the verified native TypeScript asset
        id: asset
        timeout-minutes: 80
        uses: ./.github/actions/native-typescript-asset

  # One job per release host (not a matrix) so each job exposes its own cache_key and only its own release leg needs it.
  native-typescript-asset-darwin-arm64:
    name: Native TypeScript asset · darwin-arm64
    needs: bazel-plan
    if: needs.bazel-plan.outputs.release_matrix == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      cache_key: ${{ steps.asset.outputs.cache_key }}
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile
      - name: Restore, construct on a miss and save the verified native TypeScript asset
        id: asset
        timeout-minutes: 80
        uses: ./.github/actions/native-typescript-asset

  # One job per release host (not a matrix) so each job exposes its own cache_key and only its own release leg needs it.
  native-typescript-asset-darwin-x64:
    name: Native TypeScript asset · darwin-x64
    needs: bazel-plan
    if: needs.bazel-plan.outputs.release_matrix == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 90
    outputs:
      cache_key: ${{ steps.asset.outputs.cache_key }}
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile
      - name: Restore, construct on a miss and save the verified native TypeScript asset
        id: asset
        timeout-minutes: 80
        uses: ./.github/actions/native-typescript-asset

  bazel-shards:
    name: Bazel shard · ${{ matrix.name }}
    needs: [bazel-plan, native-typescript-asset]
    # The asset job is skipped when no selected shard carries the native variables; a failed asset job stops the shards.
    if: >-
      !cancelled() && needs.bazel-plan.result == 'success' && needs.bazel-plan.outputs.execute_bazel == 'true' &&
      (needs.native-typescript-asset.result == 'success' || needs.native-typescript-asset.result == 'skipped')
    # The asset's producer image: the restored path and the Bazel action keys that inherit it must match.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.bazel-plan.outputs.shard_matrix) }}
    services:
      postgres:
        image: ${{ matrix.postgres && 'postgres:17.6-alpine' || '' }}
        env:
          POSTGRES_DB: threadnote_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d threadnote_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile

      - name: Restore the verified native TypeScript asset
        # Only shards whose targets inherit the native variables; restored from the shared asset job and re-verified.
        if: matrix.native_typescript
        timeout-minutes: 15
        uses: ./.github/actions/native-typescript-asset
        with:
          restore-only: 'true'
          cache-key: ${{ needs.native-typescript-asset.outputs.cache_key }}

      - name: Prepare Bazel workspace
        run: bun tools/bazel/prepare.mjs

      - uses: actions/download-artifact@v8
        with:
          name: bazel-selection
          path: .context/bazel-selection

      - name: Install workflow inspection prerequisite
        timeout-minutes: 5
        shell: bash
        run: |
          if ! command -v rg > /dev/null 2>&1 || ! rg --version; then
            # The image's Microsoft package source is not needed for ripgrep and can refuse requests (HTTP 403).
            sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          fi
          rg --version

      - name: Verify private Linux temporary storage
        shell: bash
        run: |
          bun --eval 'import {mkdtempSync,realpathSync,appendFileSync,rmSync} from "node:fs";
          import {runtimeOpenPrivateWriterDirectory,runtimeClosePrivateWriterDirectory} from "@threadnote/platform/system";
          const root=realpathSync(mkdtempSync("/tmp/threadnote-ci-"));
          try { const handle=runtimeOpenPrivateWriterDirectory(root); runtimeClosePrivateWriterDirectory(handle);
          appendFileSync(Bun.env.GITHUB_ENV,"THREADNOTE_CI_TEST_TMPDIR="+root+"\nTMPDIR="+root+"\n");
          console.log("Native private CI temporary storage proof passed; production qualification remains false"); }
          catch { rmSync(root,{recursive:true}); throw new Error("Native private CI temporary storage proof failed"); }'

      - name: Execute Bazel shard
        run: bun tools/ci/bazel-run-selected.mjs ".context/bazel-selection/shards/${{ matrix.id }}.json"

      - name: Remove owned Linux temporary storage
        if: always() && env.THREADNOTE_CI_TEST_TMPDIR != ''
        shell: bash
        run: |
          bun --eval 'import {lstatSync,realpathSync,rmSync} from "node:fs";
          const root=Bun.env.THREADNOTE_CI_TEST_TMPDIR;
          if(!/^\/tmp\/threadnote-ci-[A-Za-z0-9]+$/.test(root)||realpathSync(root)!==root)throw new Error("Owned CI temporary root changed");
          const stat=lstatSync(root); if(!stat.isDirectory()||stat.uid!==process.getuid()||(stat.mode&0o077)!==0)throw new Error("Owned CI temporary root changed");
          rmSync(root,{recursive:true});'

  manager-e2e:
    name: Manager browser E2E
    # The compiled candidate indexes TypeScript fixtures, so it stages the producer's verified asset on its image.
    needs: [bazel-plan, native-typescript-asset]
    if: needs.bazel-plan.outputs.manager_e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned Chromium and system dependencies
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Restore the verified native TypeScript asset
        id: native-typescript
        timeout-minutes: 15
        uses: ./.github/actions/native-typescript-asset
        with:
          restore-only: 'true'
          cache-key: ${{ needs.native-typescript-asset.outputs.cache_key }}
      - name: Build candidate and test Manager in Chromium
        run: bun run test:e2e:manager
        env:
          # A compiled candidate reads only its own runtime/typescript, which this build stages from the payload.
          THREADNOTE_TYPESCRIPT_NATIVE_ASSET_DIR: ${{ steps.native-typescript.outputs.payload }}
      - name: Preserve browser reports and synthetic failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manager-e2e
          path: .context/manager-e2e/
          include-hidden-files: true
          retention-days: 7

  recall-quality:
    name: Recall quality and non-inferiority
    # The asset job always runs when recall quality is selected; its failure skips this lane and fails the aggregate.
    needs: [bazel-plan, native-typescript-asset]
    if: needs.bazel-plan.outputs.recall_quality == 'true'
    runs-on: ubuntu-24.04

    steps:
      # The producer's checkout expression: the head commit of a pull request, so the restored asset matches these
      # sources. It repeats the producer's expression instead of reading a job output.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Restore the verified native TypeScript asset
        # The code-graph, workset, citation and backlink gates index TypeScript fixtures through the native parser.
        timeout-minutes: 15
        uses: ./.github/actions/native-typescript-asset
        with:
          restore-only: 'true'
          cache-key: ${{ needs.native-typescript-asset.outputs.cache_key }}
      - name: Frozen v1 quality and indexed-recall smoke
        run: bun tools/ci/recall-confirmation.ts
      - name: Preserve bounded recall quality diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recall-quality-production-10000
          path: |
            artifacts/recall-production-10000.json
            artifacts/recall-confirmation/
          if-no-files-found: warn
          retention-days: 7
      - name: Frozen native code graph quality gate
        run: bun run eval:code-graph
      - name: Bounded cross-repository workset quality smoke
        run: bun run eval:code-graph-workset -- --sizes 1,8
      - name: Actual-runtime memory citation and Context Brief gate
        run: bun run eval:context-brief-citations:runtime
      - name: Actual-runtime code-to-memory backlink gate
        run: bun run eval:code-memory-link-bench
      - name: Recall-v2 category and safety gate
        run: >-
          bun run eval:recall:v2 --
          --baseline apps/threadnote/test/evaluation/baselines/threadnote-4.2.7-hybrid-v8/recall-v2-lexical.json
          --fail-on-contract
          --fail-on-regression
          --max-failures 10

  windows-smoke:
    name: Bun unit smoke · Windows · ${{ matrix.shard }}
    needs: bazel-plan
    if: needs.bazel-plan.outputs.windows_smoke == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Install workflow inspection prerequisite
        shell: pwsh
        timeout-minutes: 5
        run: bun tools/ci/windows-workflow-prerequisites.ts
      - run: bun run typecheck
      - run: >-
          bun --bun vitest run --no-file-parallelism --testTimeout=120000 --shard=${{ matrix.shard }}
          --config=tools/ci/windows-smoke.config.ts
          --reporter=default --reporter=json --outputFile=.context/windows-smoke/results.json
          apps/threadnote/test/unit/windows-support.test.ts
          apps/threadnote/test/unit/command-shim.test.ts
          apps/threadnote/test/unit/effect-command.test.ts
          apps/threadnote/test/unit/effect-system.test.ts
          apps/threadnote/test/unit/standalone-process-lease.test.ts
          apps/threadnote/test/unit/process-diagnostics.test.ts
          apps/threadnote/test/unit/local-ai.test.ts
          apps/threadnote/test/unit/update.test.ts
          apps/threadnote/test/unit/mcp.test.ts
          apps/threadnote/test/dev-skills/
          apps/threadnote/test/integration/cli.dev-skills.test.ts
          packages/integrations/test/dev-skills-catalog.test.ts
      - name: Graph repair quarantine smoke
        if: matrix.shard == '1/4'
        run: >-
          bun --bun vitest run
          apps/threadnote/test/unit/code-graph.maintenance-bounded.test.ts
          -t "removes a database-less orphan spool"
      - name: Preserve Windows smoke timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-smoke-${{ strategy.job-index }}
          path: .context/windows-smoke/
          include-hidden-files: true
          if-no-files-found: ignore

  standalone-targets:
    name: Bytecode compile · every standalone target
    needs: bazel-plan
    if: needs.bazel-plan.outputs.compile_targets == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Without THREADNOTE_BUILD_TARGET the script cross-compiles every BUN_STANDALONE_TARGETS entry.
      - run: bun run compile:targets

  # Legs without a reviewed pin (musl, Windows) need no asset, so a failed asset job never skips them.
  self-contained-distribution:
    name: Self-contained Bun release · ${{ matrix.os }}
    needs: bazel-plan
    if: needs.bazel-plan.outputs.release_matrix == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-x64-musl}
          - {os: ubuntu-24.04-arm, target: linux-arm64-musl}
          - {os: windows-latest, target: windows-x64}
          - {os: windows-11-arm, target: windows-arm64}
    uses: ./.github/workflows/native-release-smoke.yml
    with:
      runner: ${{ matrix.os }}
      target: ${{ matrix.target }}

  # A pinned leg depends only on its own host's asset job and restores by that job's key on the same image.
  self-contained-distribution-linux-x64:
    name: Self-contained Bun release · ubuntu-24.04
    needs: [bazel-plan, native-typescript-asset]
    if: needs.bazel-plan.outputs.release_matrix == 'true'
    uses: ./.github/workflows/native-release-smoke.yml
    with:
      runner: ubuntu-24.04
      target: linux-x64
      native-asset-key: ${{ needs.native-typescript-asset.outputs.cache_key }}

  # A pinned leg depends only on its own host's asset job and restores by that job's key on the same image.
  self-contained-distribution-linux-arm64:
    name: Self-contained Bun release · ubuntu-24.04-arm
    needs: [bazel-plan, native-typescript-asset-linux-arm64]
    if: needs.bazel-plan.outputs.release_matrix == 'true'
    uses: ./.github/workflows/native-release-smoke.yml
    with:
      runner: ubuntu-24.04-arm
      target: linux-arm64
      native-asset-key: ${{ needs.native-typescript-asset-linux-arm64.outputs.cache_key }}

  # A pinned leg depends only on its own host's asset job and restores by that job's key on the same image.
  self-contained-distribution-darwin-arm64:
    name: Self-contained Bun release · macos-15
    needs: [bazel-plan, native-typescript-asset-darwin-arm64]
    if: needs.bazel-plan.outputs.release_matrix == 'true'
    uses: ./.github/workflows/native-release-smoke.yml
    with:
      runner: macos-15
      target: darwin-arm64
      native-asset-key: ${{ needs.native-typescript-asset-darwin-arm64.outputs.cache_key }}

  # A pinned leg depends only on its own host's asset job and restores by that job's key on the same image.
  self-contained-distribution-darwin-x64:
    name: Self-contained Bun release · macos-15-intel
    needs: [bazel-plan, native-typescript-asset-darwin-x64]
    if: needs.bazel-plan.outputs.release_matrix == 'true'
    uses: ./.github/workflows/native-release-smoke.yml
    with:
      runner: macos-15-intel
      target: darwin-x64
      native-asset-key: ${{ needs.native-typescript-asset-darwin-x64.outputs.cache_key }}

  test:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.native_workflow_stress == true && 'Native workflow stress qualification' || 'Unit and integration tests' }}
    if: always()
    needs:
      [
        native-workflow-stress,
        bazel-plan,
        bazel-plan-validation,
        native-typescript-asset,
        native-typescript-asset-linux-arm64,
        native-typescript-asset-darwin-arm64,
        native-typescript-asset-darwin-x64,
        bazel-shards,
        manager-e2e,
        recall-quality,
        windows-smoke,
        standalone-targets,
        self-contained-distribution,
        self-contained-distribution-linux-x64,
        self-contained-distribution-linux-arm64,
        self-contained-distribution-darwin-arm64,
        self-contained-distribution-darwin-x64,
      ]
    runs-on: ubuntu-latest

    steps:
      - name: Require every selected lane
        env:
          MANUAL_STRESS: ${{ github.event_name == 'workflow_dispatch' && inputs.native_workflow_stress == true }}
          NATIVE_WORKFLOW_STRESS_RESULT: ${{ needs.native-workflow-stress.result }}
          BAZEL_EXECUTE: ${{ needs.bazel-plan.outputs.execute_bazel }}
          BAZEL_PLAN_RESULT: ${{ needs.bazel-plan.result }}
          BAZEL_PLAN_VALIDATION_RESULT: ${{ needs.bazel-plan-validation.result }}
          BAZEL_SHARDS_RESULT: ${{ needs.bazel-shards.result }}
          NATIVE_TYPESCRIPT_SELECTED: ${{ needs.bazel-plan.outputs.native_typescript }}
          NATIVE_TYPESCRIPT_ASSET_RESULT: ${{ needs.native-typescript-asset.result }}
          NATIVE_TYPESCRIPT_RELEASE_ASSET_RESULTS: >-
            ${{ needs.native-typescript-asset-linux-arm64.result }}
            ${{ needs.native-typescript-asset-darwin-arm64.result }}
            ${{ needs.native-typescript-asset-darwin-x64.result }}
          MANAGER_E2E_SELECTED: ${{ needs.bazel-plan.outputs.manager_e2e }}
          MANAGER_E2E_RESULT: ${{ needs.manager-e2e.result }}
          COMPILE_SELECTED: ${{ needs.bazel-plan.outputs.compile_targets }}
          RECALL_SELECTED: ${{ needs.bazel-plan.outputs.recall_quality }}
          RELEASE_SELECTED: ${{ needs.bazel-plan.outputs.release_matrix }}
          WINDOWS_SELECTED: ${{ needs.bazel-plan.outputs.windows_smoke }}
          RECALL_RESULT: ${{ needs.recall-quality.result }}
          WINDOWS_RESULT: ${{ needs.windows-smoke.result }}
          STANDALONE_RESULT: ${{ needs.standalone-targets.result }}
          SELF_CONTAINED_RESULTS: >-
            ${{ needs.self-contained-distribution.result }}
            ${{ needs.self-contained-distribution-linux-x64.result }}
            ${{ needs.self-contained-distribution-linux-arm64.result }}
            ${{ needs.self-contained-distribution-darwin-arm64.result }}
            ${{ needs.self-contained-distribution-darwin-x64.result }}
        run: |
          if [ "$MANUAL_STRESS" = true ]; then
            test "$NATIVE_WORKFLOW_STRESS_RESULT" = success
            exit 0
          fi
          test "$BAZEL_PLAN_RESULT" = success
          test "$BAZEL_PLAN_VALIDATION_RESULT" = success
          if [ "$BAZEL_EXECUTE" = true ]; then
            test "$BAZEL_SHARDS_RESULT" = success
          else
            test "$BAZEL_SHARDS_RESULT" = skipped
          fi
          if [ "$NATIVE_TYPESCRIPT_SELECTED" = true ] || [ "$RECALL_SELECTED" = true ] || [ "$RELEASE_SELECTED" = true ] ||
            [ "$MANAGER_E2E_SELECTED" = true ]; then
            test "$NATIVE_TYPESCRIPT_ASSET_RESULT" = success
          fi
          all_success() { for result in $1; do test "$result" = success || return 1; done; }
          if [ "$RELEASE_SELECTED" = true ]; then all_success "$NATIVE_TYPESCRIPT_RELEASE_ASSET_RESULTS"; fi
          if [ "$RECALL_SELECTED" = true ]; then test "$RECALL_RESULT" = success; fi
          if [ "$MANAGER_E2E_SELECTED" = true ]; then test "$MANAGER_E2E_RESULT" = success; fi
          if [ "$WINDOWS_SELECTED" = true ]; then test "$WINDOWS_RESULT" = success; fi
          if [ "$COMPILE_SELECTED" = true ]; then test "$STANDALONE_RESULT" = success; fi
          if [ "$RELEASE_SELECTED" = true ]; then
            all_success "$SELF_CONTAINED_RESULTS"
          fi
