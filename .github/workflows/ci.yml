name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/4.0.0, release/5.0.0, release/5.1.0]

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2

jobs:
  bazel-plan:
    name: Plan affected Bazel checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      bazel_validation: ${{ steps.selection.outputs.bazel_validation }}
      execute_bazel: ${{ steps.shards.outputs.execute_bazel }}
      recall_quality: ${{ steps.selection.outputs.recall_quality }}
      release_matrix: ${{ steps.selection.outputs.release_matrix }}
      shard_matrix: ${{ steps.shards.outputs.matrix }}
      workflow_validation: ${{ steps.selection.outputs.workflow_validation }}
      windows_smoke: ${{ steps.selection.outputs.windows_smoke }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile

      - id: selection
        name: Select affected Bazel targets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun tools/ci/bazel-select.mjs --base "$BASE_SHA"

      - id: shards
        name: Plan parallel Bazel shards
        run: bun tools/ci/bazel-plan-shards.mjs

      - name: Record authoritative selection
        if: always()
        run: |
          if [ -f .context/bazel-selection/selection.json ]; then
            {
              echo '### Bazel CI selection'
              echo '```json'
              cat .context/bazel-selection/selection.json
              echo '```'
              if [ -f .context/bazel-selection/shards.json ]; then
                echo '### Parallel Bazel shards'
                echo '```json'
                cat .context/bazel-selection/shards.json
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bazel-selection
          path: .context/bazel-selection/
          include-hidden-files: true

  bazel-plan-validation:
    name: Validate Bazel selection
    needs: bazel-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate GitHub Actions workflows
        if: needs.bazel-plan.outputs.workflow_validation == 'true'
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      - uses: oven-sh/setup-bun@v2
        if: needs.bazel-plan.outputs.bazel_validation == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frozen workspace dependencies
        if: needs.bazel-plan.outputs.bazel_validation == 'true'
        run: bun install --frozen-lockfile

      - name: Prepare Bazel workspace
        if: needs.bazel-plan.outputs.bazel_validation == 'true'
        run: bun tools/bazel/prepare.mjs

      - name: Verify generated Bazel declarations
        if: needs.bazel-plan.outputs.bazel_validation == 'true'
        run: bun tools/bazel/generate.mjs --check

      - name: Verify Bazel selection edge cases
        if: needs.bazel-plan.outputs.bazel_validation == 'true'
        run: bun tools/bazel/verify-selection.mjs

  bazel-shards:
    name: Bazel shard · ${{ matrix.name }}
    needs: bazel-plan
    if: needs.bazel-plan.outputs.execute_bazel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.bazel-plan.outputs.shard_matrix) }}
    services:
      postgres:
        image: ${{ matrix.postgres && 'postgres:17.6-alpine' || '' }}
        env:
          POSTGRES_DB: threadnote_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d threadnote_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Bazel workspace
        run: bun tools/bazel/prepare.mjs

      - uses: actions/download-artifact@v8
        with:
          name: bazel-selection
          path: .context/bazel-selection

      - name: Install workflow inspection prerequisite
        timeout-minutes: 5
        shell: bash
        run: |
          if ! command -v rg > /dev/null 2>&1 || ! rg --version; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          fi
          rg --version

      - name: Execute Bazel shard
        run: bun tools/ci/bazel-run-selected.mjs ".context/bazel-selection/shards/${{ matrix.id }}.json"

  recall-quality:
    name: Recall quality and non-inferiority
    needs: bazel-plan
    if: needs.bazel-plan.outputs.recall_quality == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Frozen v1 quality and indexed-recall smoke
        run: bun run eval:recall
      - name: Frozen native code graph quality gate
        run: bun run eval:code-graph
      - name: Bounded cross-repository workset quality smoke
        run: bun run eval:code-graph-workset -- --sizes 1,8
      - name: Actual-runtime memory citation and Context Brief gate
        run: bun run eval:context-brief-citations:runtime
      - name: Actual-runtime code-to-memory backlink gate
        run: bun run eval:code-memory-link-bench
      - name: Recall-v2 category and safety gate
        run: >-
          bun run eval:recall:v2 --
          --baseline apps/threadnote/test/evaluation/baselines/threadnote-4.2.7-hybrid-v8/recall-v2-lexical.json
          --fail-on-contract
          --fail-on-regression
          --max-failures 10

  windows-smoke:
    name: Bun unit smoke · Windows · ${{ matrix.shard }}
    needs: bazel-plan
    if: needs.bazel-plan.outputs.windows_smoke == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Install workflow inspection prerequisite
        shell: pwsh
        timeout-minutes: 5
        run: bun tools/ci/windows-workflow-prerequisites.ts
      - run: bun run typecheck
      - run: >-
          bun --bun vitest run --no-file-parallelism --shard=${{ matrix.shard }}
          apps/threadnote/test/unit/windows-support.test.ts
          apps/threadnote/test/unit/command-shim.test.ts
          apps/threadnote/test/unit/effect-command.test.ts
          apps/threadnote/test/unit/effect-system.test.ts
          apps/threadnote/test/unit/standalone-process-lease.test.ts
          apps/threadnote/test/unit/process-diagnostics.test.ts
          apps/threadnote/test/unit/local-ai.test.ts
          apps/threadnote/test/unit/update.test.ts
          apps/threadnote/test/unit/mcp.test.ts
          apps/threadnote/test/dev-skills/
          apps/threadnote/test/integration/cli.dev-skills.test.ts
          packages/integrations/test/dev-skills-catalog.test.ts
      - name: Graph repair quarantine smoke
        if: matrix.shard == '1/2'
        run: >-
          bun --bun vitest run
          apps/threadnote/test/unit/code-graph.maintenance-bounded.test.ts
          -t "removes a database-less orphan spool"

  windows-h100-profile:
    name: Diagnostic only · original H100 · Windows
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 913 &&
      github.run_attempt == 1 &&
      contains(github.event.pull_request.labels.*.name, 'h100-profile-once')
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Install workflow inspection prerequisite
        shell: pwsh
        timeout-minutes: 5
        run: bun tools/ci/windows-workflow-prerequisites.ts
      # Root removes the one-use label on job start and this job before merge.
      - name: Profile unchanged original H100 once (not timing acceptance)
        shell: pwsh
        timeout-minutes: 15
        env:
          PROFILE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $out = Join-Path $env:GITHUB_WORKSPACE '.context/windows-h100-profile'
          New-Item -ItemType Directory -Force "$out/cpu" | Out-Null
          $records = @{}
          $files = @()
          $copies = @()
          $main = $null
          $rows = $null
          $testExit = $null
          $processExit = $null
          $terminated = $false
          $stage = 'preflight'
          $failures = [Collections.Generic.List[object]]::new()
          $captureErrors = 0
          $discoveryErrors = 0
          $samples = 0
          $gaps = 0
          $maxGapMs = 0
          $processTruncated = $false
          $samplingMs = 0
          $profiles = @()
          $clock = [Diagnostics.Stopwatch]::new()
          $sampler = [Diagnostics.Process]::GetCurrentProcess()
          $samplerCpuStart = $sampler.TotalProcessorTime.TotalMilliseconds
          function Record-CaptureFailure($phase, $cause) {
            $script:captureErrors++
            $kind = if ($cause) { $cause.Exception.GetType().Name } else { 'other' }
            if ($kind -notin @('IOException', 'UnauthorizedAccessException', 'Win32Exception', 'InvalidOperationException', 'RuntimeException')) { $kind = 'other' }
            if ($failures.Count -lt 16) { $failures.Add(@{stage = $phase; kind = $kind}) }
          }
          try {
            $stage = 'bun-capabilities'
            $bun = (Get-Command bun -CommandType Application).Source
            if ([IO.Path]::GetFileName($bun) -ine 'bun.exe') { throw 'Unexpected Bun executable' }
            $version = (& $bun --version).Trim()
            if ($LASTEXITCODE -ne 0 -or $version -ne $env:BUN_VERSION) { throw 'Unexpected Bun version' }
            $help = & $bun --help | Out-String
            foreach ($flag in @('--cpu-prof', '--cpu-prof-dir', '--cpu-prof-interval')) {
              if (-not $help.Contains($flag)) { throw 'Missing profiler capability' }
            }
            $stage = 'counter-capabilities'
            $probe = Get-CimInstance Win32_Process -Filter "ProcessId = $PID" -Property ProcessId, ParentProcessId, CreationDate
            if (-not $probe.CreationDate -or $sampler.TotalProcessorTime.TotalMilliseconds -lt 0) { throw 'Missing counters' }
            $stage = 'fixture-conservation'
            $fixture = 'apps/threadnote/test/dev-skills/native-authoring-lifecycle.test.ts'
            $bytes = [Text.Encoding]::UTF8.GetBytes([IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE $fixture)).Replace("`r`n", "`n"))
            $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
            if ($bytes.Length -ne 80683 -or $hash -ne 'd354d96e996d7b514d0a242b9b9901adb2151a017480e9db479bb5c35179bb1d') { throw 'Original H100 changed' }
            $stage = 'source-conservation'
            $head = (& git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $head -ne $env:PROFILE_HEAD) { throw 'Unexpected source head' }
            @{
              head = $head; bun = $version; bunRevision = (& $bun --revision)
              vitest = (Get-Content node_modules/vitest/package.json -Raw | ConvertFrom-Json).version
              imageOS = $env:ImageOS; imageVersion = $env:ImageVersion
              fixtureBytes = $bytes.Length; fixtureSHA256 = $hash
              intervalMs = 1000; maxSamples = 900; maxProcesses = 8; maxThreadsPerSnapshot = 64
              scope = 'Diagnostic only; isolated profiled run is not timing acceptance'
            } | ConvertTo-Json | Set-Content "$out/manifest.json"
            $stage = 'launch'
            $start = [Diagnostics.ProcessStartInfo]::new($bun)
            $start.UseShellExecute = $false
            $start.WorkingDirectory = $env:GITHUB_WORKSPACE
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            foreach ($argument in @('--cpu-prof', "--cpu-prof-dir=$out/cpu", '--cpu-prof-interval=10000', './node_modules/vitest/vitest.mjs', 'run', '--no-file-parallelism', $fixture, '-t', 'retains and navigates 100 same-length revisions of a large native plan$')) {
              $start.ArgumentList.Add($argument)
            }
            $files = @([IO.File]::Create("$out/stdout.log"), [IO.File]::Create("$out/stderr.log"))
            $rows = [IO.StreamWriter]::new("$out/process-samples.jsonl", $false, [Text.UTF8Encoding]::new($false))
            $rows.AutoFlush = $true
            $clock.Start()
            $main = [Diagnostics.Process]::Start($start)
            $copies = @($main.StandardOutput.BaseStream.CopyToAsync($files[0]), $main.StandardError.BaseStream.CopyToAsync($files[1]))
            $mainCreated = $main.StartTime.ToUniversalTime()
            $stage = 'sampling'
            $previousMs = 0
            while (-not $main.HasExited -and $samples -lt 900) {
              $tick = $clock.ElapsedMilliseconds
              $gap = $tick - $previousMs
              if ($samples -gt 0 -and $gap -gt 1500) { $gaps++ }
              $maxGapMs = [Math]::Max($maxGapMs, $gap)
              $previousMs = $tick
              $samples++
              $family = @{}
              $family[$main.Id] = @{created = $mainCreated; process = $main}
              try {
                $candidates = @(Get-CimInstance Win32_Process -Filter "Name = 'bun.exe'" -Property ProcessId, ParentProcessId, CreationDate)
                for ($depth = 0; $depth -lt 8; $depth++) {
                  foreach ($candidate in $candidates) {
                    $created = $candidate.CreationDate.ToUniversalTime()
                    $parent = $family[[int]$candidate.ParentProcessId]
                    if ($candidate.ProcessId -eq $main.Id) {
                      if ([Math]::Abs(($created - $mainCreated).TotalMilliseconds) -gt 1 -or $main.HasExited) { continue }
                    } elseif (-not $parent -or $parent.process.HasExited -or $created -lt $parent.created) { continue }
                    $key = "$($candidate.ProcessId):$($created.Ticks)"
                    if ($records.ContainsKey($key)) {
                      if (-not $records[$key].process.HasExited) { $family[[int]$candidate.ProcessId] = @{created = $records[$key].started; process = $records[$key].process} }
                      continue
                    }
                    if ($records.Count -ge 8) { $processTruncated = $true; continue }
                    $handle = $null
                    try {
                      $handle = [Diagnostics.Process]::GetProcessById([int]$candidate.ProcessId)
                      $null = $handle.Handle
                      $started = $handle.StartTime.ToUniversalTime()
                      if ([Math]::Abs(($started - $created).TotalMilliseconds) -gt 1 -or ($parent -and ($parent.process.HasExited -or $started -lt $parent.created))) { throw 'Process identity changed' }
                      $records[$key] = @{
                        process = $handle; pid = [int]$candidate.ProcessId; parent = [int]$candidate.ParentProcessId
                        created = $started.ToString('o'); started = $started
                        first = $null; last = $null; readErrors = 0; terminal = $null
                      }
                      if (-not $handle.HasExited) { $family[[int]$candidate.ProcessId] = @{created = $started; process = $handle} }
                    } catch {
                      $discoveryErrors++
                      if ($handle) { $handle.Dispose() }
                    }
                  }
                }
              } catch { $discoveryErrors++ }
              foreach ($record in $records.Values) {
                try {
                  $process = $record.process
                  $process.Refresh()
                  $cpu = $process.TotalProcessorTime.TotalMilliseconds
                  $states = [int[]]::new(8)
                  $threadErrors = 0
                  $threadTruncated = $false
                  try {
                    $threads = $process.Threads
                    $threadTruncated = $threads.Count -gt 64
                    foreach ($thread in @($threads | Select-Object -First 64)) {
                      try { $states[[Math]::Min(7, [int]$thread.ThreadState)]++ } catch { $threadErrors++ } finally { $thread.Dispose() }
                    }
                  } catch { $threadErrors++ }
                  $row = @{
                    elapsedMs = $clock.ElapsedMilliseconds; pid = $record.pid; parent = $record.parent; created = $record.created
                    role = $(if ($record.pid -eq $main.Id) { 'runner' } elseif ($record.parent -eq $main.Id) { 'direct-bun-child' } else { 'bun-descendant' })
                    cpuMs = $cpu; userMs = $process.UserProcessorTime.TotalMilliseconds; kernelMs = $process.PrivilegedProcessorTime.TotalMilliseconds
                    threadStates = $states; threadReadErrors = $threadErrors; threadsTruncated = $threadTruncated
                  }
                  if ($record.last -and $cpu -lt $record.last.cpuMs) { throw 'CPU counter decreased' }
                  if (-not $record.first) { $record.first = $row }
                  $record.last = $row
                  $rows.WriteLine(($row | ConvertTo-Json -Compress))
                } catch { $record.readErrors++ }
              }
              $samplingMs += $clock.ElapsedMilliseconds - $tick
              [void]$main.WaitForExit([int][Math]::Max(1, 1000 - ($clock.ElapsedMilliseconds - $tick)))
            }
            if (-not $main.HasExited) { throw 'Diagnostic sample limit reached' }
            $testExit = $main.ExitCode
          } catch { Record-CaptureFailure $stage $_ } finally {
            if ($main -and $main.HasExited) { $testExit = $main.ExitCode }
            if ($main -and -not $main.HasExited) {
              $terminated = $true
              try { $main.Kill($true); [void]$main.WaitForExit(5000) } catch { Record-CaptureFailure 'owned-cleanup' $_ }
            }
            foreach ($record in $records.Values) {
              try {
                if (-not $record.process.HasExited) { $terminated = $true; $record.process.Kill($true); [void]$record.process.WaitForExit(5000) }
                $record.terminal = @{elapsedMs = $clock.ElapsedMilliseconds; cpuMs = $record.process.TotalProcessorTime.TotalMilliseconds; exited = $record.process.HasExited}
              } catch { Record-CaptureFailure 'owned-cleanup' $_ }
            }
            if ($main -and $main.HasExited) { $processExit = $main.ExitCode }
            if ($copies.Count) {
              try { if (-not [Threading.Tasks.Task]::WhenAll([Threading.Tasks.Task[]]$copies).Wait(5000)) { Record-CaptureFailure 'output-drain-timeout' $null } } catch { Record-CaptureFailure 'output-drain' $_ }
            }
            foreach ($file in $files) { $file.Dispose() }
            if ($rows) { $rows.Dispose() }
            $clock.Stop()
            $profileFiles = @(Get-ChildItem "$out/cpu" -Filter '*.cpuprofile')
            foreach ($file in @($profileFiles | Select-Object -First 8)) {
              $valid = $false
              try {
                if ($file.Length -le 64MB) {
                  $cpuProfile = Get-Content $file.FullName -Raw | ConvertFrom-Json -AsHashtable
                  $valid = $cpuProfile.nodes -is [Array] -and $cpuProfile.samples -is [Array]
                }
              } catch { Record-CaptureFailure 'profile-read' $_ }
              $match = [regex]::Match($file.Name, '^CPU\.\d{8}\.\d{6}\.(\d+)\.')
              $profiles += @{name = $file.Name; bytes = $file.Length; valid = $valid; pid = $(if ($match.Success) { [int]$match.Groups[1].Value } else { $null })}
            }
            $workers = @($records.Values | Where-Object { $main -and $_.parent -eq $main.Id -and $_.first -and $_.last })
            $workerProfile = $workers.Count -eq 1 -and @($profiles | Where-Object { $_.valid -and $_.pid -in $workers.pid }).Count -gt 0
            if ($main -and $workers.Count -eq 0) { Record-CaptureFailure 'missing-worker-counters' $null }
            @{
              testExit = $testExit; processExit = $processExit; ownedTreeTerminated = $terminated
              workerCandidatePids = @($workers | ForEach-Object { $_.pid }); workerJSProfilePresent = $workerProfile; workerIdentityAmbiguous = $workers.Count -ne 1
              failures = $failures.ToArray(); captureErrors = $captureErrors; discoveryErrors = $discoveryErrors
              elapsedMs = $clock.ElapsedMilliseconds; samples = $samples; gaps = $gaps; maxGapMs = $maxGapMs
              samplingElapsedMs = $samplingMs; samplerCpuMs = $sampler.TotalProcessorTime.TotalMilliseconds - $samplerCpuStart
              processesTruncated = $processTruncated; processes = @($records.Values | ForEach-Object { @{pid = $_.pid; parent = $_.parent; created = $_.created; first = $_.first; last = $_.last; terminal = $_.terminal; readErrors = $_.readErrors} })
              profiles = $profiles; profileFilesTruncated = $profileFiles.Count -gt 8
              limits = 'CPU counters cover first/last observed intervals only. Thread states are snapshots, not wait durations. Short Git children may be missed. Parent-only profiles are not worker JS attribution. Missing worker profiles leave production-vs-diagnostic CPU unknown. Profiled pass is not timing acceptance.'
            } | ConvertTo-Json -Depth 8 | Set-Content "$out/summary.json"
            foreach ($record in $records.Values) { $record.process.Dispose() }
            if ($main) { $main.Dispose() }
            $sampler.Dispose()
          }
          if ($null -ne $testExit -and $testExit -ne 0) { exit $testExit }
          if ($captureErrors -gt 0 -or $null -eq $testExit) { exit 2 }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-original-h100-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/windows-h100-profile/
          include-hidden-files: true
          retention-days: 1

  standalone-targets:
    name: Bytecode compile · ${{ matrix.target }}
    needs: bazel-plan
    if: needs.bazel-plan.outputs.release_matrix == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - bun-darwin-arm64
          - bun-darwin-x64
          - bun-linux-arm64
          - bun-linux-arm64-musl
          - bun-linux-x64-baseline
          - bun-linux-x64-musl-baseline
          - bun-windows-arm64
          - bun-windows-x64-baseline

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run compile:targets
        env:
          THREADNOTE_BUILD_TARGET: ${{ matrix.target }}

  self-contained-distribution:
    name: Self-contained Bun release · ${{ matrix.os }}
    needs: bazel-plan
    if: needs.bazel-plan.outputs.release_matrix == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: linux-x64}
          - {os: ubuntu-24.04-arm, target: linux-arm64}
          - {os: macos-15, target: darwin-arm64}
          - {os: macos-15-intel, target: darwin-x64}
          - {os: windows-latest, target: windows-x64}
          - {os: windows-11-arm, target: windows-arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Linux workflow prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: macOS workflow prerequisites
        if: runner.os == 'macOS'
        run: command -v rg || brew install ripgrep
      - name: Windows workflow prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: bun tools/ci/windows-workflow-prerequisites.ts
      - run: bun run check:self-contained
      - name: Platform process identity smoke
        run: bun --bun vitest run apps/threadnote/test/unit/effect-system.test.ts
      - name: Native workflow foundation smoke
        run: >-
          bun --bun vitest run
          packages/workflow-automations/test/inventory.test.ts
          packages/workflow-automations/test/baseline.test.ts
      - run: bun run test:smoke:self-contained
      - name: Real predecessor upgrade and model setup admission
        if: matrix.os == 'macos-15'
        env:
          GH_TOKEN: ${{ github.token }}
          THREADNOTE_QUALIFY_OLD_UPGRADE: ephemeral-macos-real-predecessor
          THREADNOTE_UPGRADE_RECEIPT_DIR: ${{ runner.temp }}/threadnote-upgrade-receipts
        run: |
          test "$THREADNOTE_QUALIFY_OLD_UPGRADE" = ephemeral-macos-real-predecessor
          predecessor_root="$(mktemp -d "$RUNNER_TEMP/threadnote-beta4.XXXXXX")"
          chmod 700 "$predecessor_root"
          mkdir -p "$THREADNOTE_UPGRADE_RECEIPT_DIR"
          gh api repos/threadnote/threadnote/releases/tags/v5.3.0-beta.4 > "$THREADNOTE_UPGRADE_RECEIPT_DIR/predecessor-release-api.json"
          jq -e '.immutable == true and .draft == false and .tag_name == "v5.3.0-beta.4"' "$THREADNOTE_UPGRADE_RECEIPT_DIR/predecessor-release-api.json"
          gh release download v5.3.0-beta.4 --repo threadnote/threadnote --pattern threadnote-darwin-arm64.tar.gz --dir "$predecessor_root"
          THREADNOTE_OLD_RELEASE_ARCHIVE="$predecessor_root/threadnote-darwin-arm64.tar.gz" \
          THREADNOTE_OLD_RELEASE_METADATA="$THREADNOTE_UPGRADE_RECEIPT_DIR/predecessor-release-api.json" \
            bun --bun vitest run --config vitest.e2e.config.ts apps/threadnote/test/e2e/model-setup-upgrade.e2e.ts
      - name: Preserve predecessor upgrade receipts
        if: always() && matrix.os == 'macos-15'
        uses: actions/upload-artifact@v7
        with:
          name: model-setup-predecessor-upgrade
          path: ${{ runner.temp }}/threadnote-upgrade-receipts
          if-no-files-found: error
      - name: Installed release E2E
        run: bun run test:e2e:local-bins
      - name: Archive the native release
        run: bun run archive:release
        env:
          THREADNOTE_RELEASE_TARGET: ${{ matrix.target }}
      - name: Extracted release and installed workflow lifecycle
        run: bun --bun vitest run apps/threadnote/test/dev-skills/release-artifact.test.ts
        env:
          THREADNOTE_RELEASE_ARCHIVE: artifacts/threadnote-${{ matrix.target }}.tar.gz
      - name: Workflow journal persistence smoke
        run: bun --bun vitest run apps/threadnote/test/dev-skills/workflow-journal-validation.test.ts
      - name: Preserve bounded release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dev-skills-release-${{ matrix.target }}
          path: .context/release-artifact/
          if-no-files-found: ignore

  test:
    name: Unit and integration tests
    if: always()
    needs:
      [
        bazel-plan,
        bazel-plan-validation,
        bazel-shards,
        recall-quality,
        windows-smoke,
        standalone-targets,
        self-contained-distribution,
      ]
    runs-on: ubuntu-latest

    steps:
      - name: Require every selected lane
        env:
          BAZEL_EXECUTE: ${{ needs.bazel-plan.outputs.execute_bazel }}
          BAZEL_PLAN_RESULT: ${{ needs.bazel-plan.result }}
          BAZEL_PLAN_VALIDATION_RESULT: ${{ needs.bazel-plan-validation.result }}
          BAZEL_SHARDS_RESULT: ${{ needs.bazel-shards.result }}
          RECALL_SELECTED: ${{ needs.bazel-plan.outputs.recall_quality }}
          RELEASE_SELECTED: ${{ needs.bazel-plan.outputs.release_matrix }}
          WINDOWS_SELECTED: ${{ needs.bazel-plan.outputs.windows_smoke }}
          RECALL_RESULT: ${{ needs.recall-quality.result }}
          WINDOWS_RESULT: ${{ needs.windows-smoke.result }}
          STANDALONE_RESULT: ${{ needs.standalone-targets.result }}
          SELF_CONTAINED_RESULT: ${{ needs.self-contained-distribution.result }}
        run: |
          test "$BAZEL_PLAN_RESULT" = success
          test "$BAZEL_PLAN_VALIDATION_RESULT" = success
          if [ "$BAZEL_EXECUTE" = true ]; then
            test "$BAZEL_SHARDS_RESULT" = success
          else
            test "$BAZEL_SHARDS_RESULT" = skipped
          fi
          if [ "$RECALL_SELECTED" = true ]; then test "$RECALL_RESULT" = success; fi
          if [ "$WINDOWS_SELECTED" = true ]; then test "$WINDOWS_RESULT" = success; fi
          if [ "$RELEASE_SELECTED" = true ]; then
            test "$STANDALONE_RESULT" = success
            test "$SELF_CONTAINED_RESULT" = success
          fi
