name: Validate Windows native fixture cleanup
on:
  push:
    branches: [codex/windows-fixture-backport-validation]
    paths: [.github/workflows/windows-fixture-validation.yml]

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4
  CODE_GRAPH_EMBEDDING_MODEL_ID: bge-small-en-v1.5-q8
  CODE_GRAPH_EMBEDDING_MODEL_SHA256: f046db1dc724cf4f6f0a0c5917e922823b73eb1d27b8f9a9c2797f7866974804

jobs:
  repo-checks:
    name: Verify release branch repository contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: d0911493e8012ff7ed7b8582f2448a733e0584da
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run check:repo
