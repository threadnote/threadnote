name: Native release smoke

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      native-asset-key:
        # The caller's per-host asset job cache_key output; required on a reviewed-pin (non-musl, non-Windows) leg.
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4

jobs:
  build:
    name: Build and qualify native release
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Route Bun caches outside the source checkout
        shell: bash
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/threadnote-bun-install
          BUN_RUNTIME_TRANSPILER_CACHE_PATH: ${{ runner.temp }}/threadnote-bun-transpiler
        run: |
          printf '%s\n' "BUN_INSTALL_CACHE_DIR=$BUN_INSTALL_CACHE_DIR" >> "$GITHUB_ENV"
          printf '%s\n' "BUN_RUNTIME_TRANSPILER_CACHE_PATH=$BUN_RUNTIME_TRANSPILER_CACHE_PATH" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Observe Windows native process and primitive components
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        env:
          SEMANTIC_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          New-Item -ItemType Directory -Force .context/semantic-platform | Out-Null
          # Account-home identity evidence for the cold setup check: SIDs and ACL ownership only, no file contents.
          $sid = [System.Security.Principal.SecurityIdentifier]
          $accountHome = [ordered]@{
            user = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
            profile = $env:USERPROFILE
            resolvedProfile = (Get-Item -LiteralPath $env:USERPROFILE).FullName
            owners = @($env:USERPROFILE, (Split-Path $env:USERPROFILE), ([System.IO.Path]::GetPathRoot($env:USERPROFILE))) | ForEach-Object { [ordered]@{ path = $_; owner = (Get-Acl -LiteralPath $_).GetOwner($sid).Value; protected = (Get-Acl -LiteralPath $_).AreAccessRulesProtected } }
          }
          $accountHome | ConvertTo-Json -Depth 4 | Tee-Object -FilePath .context/semantic-platform/windows-account-home.json
          bun --eval 'import {mkdirSync,readFileSync,writeFileSync} from "node:fs"; import {createHash} from "node:crypto"; import {release} from "node:os";
          const paths=["packages/platform/src/system.ts","packages/platform/src/writer-system/provider.ts","packages/platform/src/writer-system/provider-windows.ts","packages/platform/src/writer-system/windows-native.ts","packages/platform/src/writer-system/windows-files.ts","packages/platform/src/writer_system.ts","packages/platform/src/writer-system/windows-writer.ts","packages/platform/src/writer-system/writer-transaction.ts","packages/platform/test/writer-system/windows-writer.test.ts","packages/platform/test/writer-system/provider-process.test.ts","packages/platform/test/writer-system/windows-native.test.ts","apps/threadnote/test/unit/semantic-writer-process.test.ts",".github/workflows/native-release-smoke.yml"];
          writeFileSync(".context/semantic-platform/windows-source.json",JSON.stringify({version:1,scope:"native-component-observation",sourceCommit:Bun.env.SEMANTIC_SOURCE_COMMIT,os:process.platform,osBuild:release(),architecture:process.arch,bun:Bun.version,productionQualified:false,sourceHashes:Object.fromEntries(paths.map(path=>[path,createHash("sha256").update(readFileSync(path)).digest("hex")]))}));'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun --bun vitest run packages/platform/test/writer-system/provider-process.test.ts packages/platform/test/writer-system/windows-native.test.ts packages/platform/test/writer-system/windows-writer.test.ts apps/threadnote/test/unit/semantic-writer-process.test.ts --reporter=default --reporter=json --outputFile=.context/semantic-platform/windows-components.json 2>&1 | Tee-Object -FilePath .context/semantic-platform/windows-components.log
          $semanticComponentExit = $LASTEXITCODE
          @{ version = 1; scope = 'native-component-observation'; exitCode = $semanticComponentExit; productionQualified = $false } | ConvertTo-Json | Set-Content .context/semantic-platform/windows-component-status.json
          exit $semanticComponentExit
      - name: Require native semantic platform capability
        # Musl targets prove the native semantic platform in the musl-native job's own userspace.
        # The Windows private writer is declared unsupported until it is qualified: on Windows this step requires that
        # declaration (writer false, provider tree true) and records it. It never qualifies Windows.
        if: ${{ !cancelled() && !endsWith(inputs.target, '-musl') }}
        env:
          EXPECTED_NATIVE_TARGET: ${{ inputs.target == 'linux-x64' && 'linux-x64-baseline' || inputs.target == 'windows-x64' && 'windows-x64-baseline' || inputs.target }}
        run: >-
          bun --eval 'import {runtimeNativePlatformTarget,runtimeNativePlatformSupport} from "@threadnote/platform/system";
          import {mkdirSync,writeFileSync} from "node:fs";
          const actual=runtimeNativePlatformTarget(),support=runtimeNativePlatformSupport();
          mkdirSync(".context/semantic-platform",{recursive:true});
          writeFileSync(".context/semantic-platform/native.json",JSON.stringify({actual,expected:Bun.env.EXPECTED_NATIVE_TARGET,support,productionQualified:false}));
          if(actual!==Bun.env.EXPECTED_NATIVE_TARGET||support.writer!==(process.platform!=="win32")||!support.providerTree)throw new Error("Native semantic platform capability differs from its declaration; qualification blocked");'
      - name: Linux workflow prerequisites
        if: runner.os == 'Linux'
        run: |
          # The image's Microsoft package source is not needed for these packages and can refuse requests (HTTP 403).
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          sudo apt-get update
          sudo apt-get install -y ripgrep bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify private Linux temporary storage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bun --eval 'import {mkdtempSync,realpathSync,appendFileSync,rmSync} from "node:fs";
          import {runtimeOpenPrivateWriterDirectory,runtimeClosePrivateWriterDirectory} from "@threadnote/platform/system";
          const root=realpathSync(mkdtempSync("/tmp/threadnote-ci-"));
          try { const handle=runtimeOpenPrivateWriterDirectory(root); runtimeClosePrivateWriterDirectory(handle);
          appendFileSync(Bun.env.GITHUB_ENV,"THREADNOTE_CI_TEST_TMPDIR="+root+"\nTMPDIR="+root+"\n");
          console.log("Native private CI temporary storage proof passed; production qualification remains false"); }
          catch { rmSync(root,{recursive:true}); throw new Error("Native private CI temporary storage proof failed"); }'
      - name: macOS workflow prerequisites
        if: runner.os == 'macOS'
        run: command -v rg || brew install ripgrep
      - name: Windows workflow prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: bun tools/ci/windows-workflow-prerequisites.ts
      - run: bun run check:self-contained
      - name: Platform process identity smoke
        run: bun --bun vitest run apps/threadnote/test/unit/effect-system.test.ts
      - name: Checkpoint compression golden digests
        run: >-
          bun --bun vitest run packages/graph/test/unit/code-graph.checkpoint-pack.property.test.ts
          -t "pins each compression profile"
      - name: Native workflow foundation smoke
        run: >-
          bun --bun vitest run
          packages/workflow-automations/test/inventory.test.ts
          packages/workflow-automations/test/baseline.test.ts
      - name: Restore the verified native TypeScript asset
        # semantic-mcp-cli and the semantic TypeScript provider need it on every reviewed-pin host; this is also the only
        # test coverage of the darwin-x64 and arm64 pins. The ci.yml per-host asset job saved it; a miss fails here.
        # Windows has no reviewed pin yet (the action exports nothing); musl targets run these tests in musl-native.
        if: ${{ !endsWith(inputs.target, '-musl') && runner.os != 'Windows' }}
        id: native-typescript
        timeout-minutes: 15
        uses: ./.github/actions/native-typescript-asset
        with:
          restore-only: 'true'
          cache-key: ${{ inputs.native-asset-key }}
      - name: Semantic native ownership and safety components
        if: ${{ !endsWith(inputs.target, '-musl') && runner.os != 'Windows' }}
        run: >-
          bun --bun vitest run
          packages/platform/test/system-stable-read.test.ts
          packages/platform/test/writer-system/linux-acl.test.ts
          packages/platform/test/writer-system/provider-process.test.ts
          apps/threadnote/test/unit/semantic-runtime.test.ts
          apps/threadnote/test/unit/semantic-writer-process.test.ts
          apps/threadnote/test/unit/semantic-operations.test.ts
          apps/threadnote/test/unit/semantic-mcp-cli.test.ts
          apps/threadnote/test/unit/semantic-python.test.ts
          apps/threadnote/test/unit/semantic-go-rust.test.ts
          apps/threadnote/test/unit/semantic-java-preparation.test.ts
          --reporter=default --reporter=json --outputFile=.context/semantic-platform/components.json
      - name: Semantic native platform components
        # Windows semantic provider cells are not qualified, and the application semantic suites assume POSIX paths;
        # Windows runs only the platform ownership and safety tests until Windows semantic support is planned.
        if: runner.os == 'Windows'
        run: >-
          bun --bun vitest run
          packages/platform/test/system-stable-read.test.ts
          packages/platform/test/writer-system/linux-acl.test.ts
          packages/platform/test/writer-system/provider-process.test.ts
          --reporter=default --reporter=json --outputFile=.context/semantic-platform/components.json
      - name: Darwin signed native TypeScript identity components
        # Bazel shards run on Linux only. These need macOS (codesign, clang, csops) and the restored prepared asset,
        # which also exports THREADNOTE_NATIVE_TYPESCRIPT_REQUIRED, so a missing tool or asset fails instead of skipping.
        # They also run after a failed earlier test step, so a kernel identity refusal there is diagnosed here.
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.native-typescript.outcome == 'success' }}
        run: >-
          bun --bun vitest run
          packages/platform/test/writer-system/provider-darwin-image.test.ts
          tools/ci/test/macho-code-identity.test.ts
          tools/ci/test/signed-native-typescript.test.ts
          packages/graph/test/unit/code-graph.extractor-lazy-loading.test.ts
          apps/threadnote/test/unit/semantic-native-image-launch.test.ts
          --reporter=default --reporter=json --outputFile=.context/semantic-platform/darwin-signed-components.json
      - name: Preserve semantic component evidence
        if: ${{ always() && !endsWith(inputs.target, '-musl') }}
        uses: actions/upload-artifact@v7
        with:
          name: semantic-components-${{ inputs.target }}
          path: .context/semantic-platform/
          include-hidden-files: true
          if-no-files-found: error
      - name: Initialize native Windows C toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -property installationPath
          if (!$installation) { throw 'Visual Studio native build tools are required.' }
          Import-Module "$installation\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          $architecture = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'x64' }
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments "-arch=$architecture -host_arch=$architecture"
          foreach ($name in @('PATH','INCLUDE','LIB','LIBPATH','VCToolsInstallDir','WindowsSdkDir','WindowsSDKVersion')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          }
      - name: Install pinned native vector toolchain
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Build native payload
        if: runner.os != 'Linux'
        run: bun run build:release
        env:
          THREADNOTE_BUILD_TARGET: ${{ inputs.target == 'windows-x64' && 'bun-windows-x64-baseline' || format('bun-{0}', inputs.target) }}
          # Stages runtime/typescript on a reviewed-pin host; empty on Windows, which builds without native TypeScript.
          THREADNOTE_TYPESCRIPT_NATIVE_ASSET_DIR: ${{ steps.native-typescript.outputs.payload }}
      - name: Build GNU payload at the preserved libc floor
        if: runner.os == 'Linux' && !endsWith(inputs.target, '-musl')
        run: >-
          bun scripts/assemble-native-inference.ts --gnu-container
          --container-command-json "$NATIVE_RELEASE_COMMAND_JSON"
        env:
          # With a payload, the glibc 2.17 container defers native TypeScript staging to the next host step.
          THREADNOTE_TYPESCRIPT_NATIVE_ASSET_DIR: ${{ steps.native-typescript.outputs.payload }}
          # Keep $PWD literal until Bash runs inside the pinned native container. glibc 2.17 has no
          # posix_spawn_file_actions_addchdir_np (2.29), so the container must see the owned provider tree unavailable.
          NATIVE_RELEASE_COMMAND_JSON: >-
            ["bash","-ec","set -euo pipefail; bun run build:release; bun scripts/verify-native-vector-reader.ts --required; bun --eval \"import {runtimeNativePlatformSupport} from '@threadnote/platform/system'; if (runtimeNativePlatformSupport().providerTree) throw new Error('glibc 2.17 admitted the owned provider tree');\"; export THREADNOTE_NATIVE_VECTOR_READER_REQUIRED=1 THREADNOTE_NATIVE_VECTOR_READER_MANIFEST=\"$PWD/dist/runtime/vector-reader/manifest.json\" THREADNOTE_NATIVE_VECTOR_READER_SOURCE_ROOT=\"$PWD\"; bun --bun vitest run packages/recall/test/unit/native-vector-reader.test.ts packages/recall/test/background-vector-step.test.ts apps/threadnote/test/integration/recall-admission-budget.test.ts apps/threadnote/test/unit/vector-index.test.ts apps/threadnote/test/unit/vector-index.eligibility.test.ts packages/recall/test/unit/vector-scope-upgrade.test.ts apps/threadnote/test/unit/recall.mcp-background-refresh.test.ts; bun --bun vitest run --maxWorkers=1 --no-file-parallelism apps/threadnote/test/integration/vector-native-read-boundary.test.ts; bun --bun vitest run --config vitest.e2e.config.ts apps/threadnote/test/e2e/local-bins.e2e.ts -t \"recalls saved memory|loads only the bundled\""]
      - name: Stage the native TypeScript asset on the host
        # The checkout is back with the runner user, so the staged asset passes the runtime's ownership checks.
        if: runner.os == 'Linux' && !endsWith(inputs.target, '-musl')
        run: bun scripts/stage-native-typescript-release.ts
        env:
          THREADNOTE_TYPESCRIPT_NATIVE_ASSET_DIR: ${{ steps.native-typescript.outputs.payload }}
      - name: Build musl payload at the preserved libc floor
        if: endsWith(inputs.target, '-musl')
        run: >-
          bun scripts/assemble-native-inference.ts --musl-container
          --container-command-json "$NATIVE_RELEASE_COMMAND_JSON"
        env:
          # Keep $PWD literal until Bash runs inside the pinned native container.
          NATIVE_RELEASE_COMMAND_JSON: >-
            ["bash","-ec","set -euo pipefail; bun run build:release; bun scripts/verify-native-vector-reader.ts --required; export THREADNOTE_NATIVE_VECTOR_READER_REQUIRED=1 THREADNOTE_NATIVE_VECTOR_READER_MANIFEST=\"$PWD/dist/runtime/vector-reader/manifest.json\" THREADNOTE_NATIVE_VECTOR_READER_SOURCE_ROOT=\"$PWD\"; bun --bun vitest run packages/recall/test/unit/native-vector-reader.test.ts packages/recall/test/background-vector-step.test.ts apps/threadnote/test/integration/recall-admission-budget.test.ts apps/threadnote/test/unit/vector-index.test.ts apps/threadnote/test/unit/vector-index.eligibility.test.ts packages/recall/test/unit/vector-scope-upgrade.test.ts apps/threadnote/test/unit/recall.mcp-background-refresh.test.ts; bun --bun vitest run --maxWorkers=1 --no-file-parallelism apps/threadnote/test/integration/vector-native-read-boundary.test.ts; bun scripts/smoke-self-contained.ts; bun --bun vitest run --config vitest.e2e.config.ts apps/threadnote/test/e2e/local-bins.e2e.ts -t \"recalls saved memory|loads only the bundled\""]
      - name: Verify bundled vector reader
        if: runner.os != 'Linux'
        run: bun scripts/verify-native-vector-reader.ts --required
      - name: Exercise Rust through the production ready-read worker
        if: runner.os != 'Linux'
        run: >-
          bun --bun vitest run
          packages/recall/test/unit/native-vector-reader.test.ts
          packages/recall/test/background-vector-step.test.ts
          apps/threadnote/test/integration/recall-admission-budget.test.ts
          apps/threadnote/test/unit/vector-index.test.ts
          apps/threadnote/test/unit/vector-index.eligibility.test.ts
          packages/recall/test/unit/vector-scope-upgrade.test.ts
          apps/threadnote/test/unit/recall.mcp-background-refresh.test.ts
        env:
          THREADNOTE_NATIVE_VECTOR_READER_REQUIRED: '1'
          THREADNOTE_NATIVE_VECTOR_READER_MANIFEST: ${{ github.workspace }}/dist/runtime/vector-reader/manifest.json
          THREADNOTE_NATIVE_VECTOR_READER_SOURCE_ROOT: ${{ github.workspace }}
      - name: Exercise the actual ready-read worker without competing suites
        if: runner.os != 'Linux'
        run: >-
          bun --bun vitest run --maxWorkers=1 --no-file-parallelism
          apps/threadnote/test/integration/vector-native-read-boundary.test.ts
        env:
          THREADNOTE_NATIVE_VECTOR_READER_REQUIRED: '1'
          THREADNOTE_NATIVE_VECTOR_READER_MANIFEST: ${{ github.workspace }}/dist/runtime/vector-reader/manifest.json
          THREADNOTE_NATIVE_VECTOR_READER_SOURCE_ROOT: ${{ github.workspace }}
      - name: Self-contained native smoke
        # GNU payloads are built in a root container that returns them to the runner user; the smoke then runs here as
        # that user, so the staged native TypeScript asset passes its ownership checks. Musl smokes in its container.
        if: ${{ !endsWith(inputs.target, '-musl') }}
        run: bun scripts/smoke-self-contained.ts
      - name: Inspect bounded Windows application failure metadata
        if: failure() && runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 1
        shell: pwsh
        run: |
          $summary = @{
            version = 1; status = 'unknown'; recentSeconds = 180; queryLimitReached = $false
            sourceBunResolved = $false
            cdb = @{ available = $false; version = 'unknown'; sha256 = 'unknown'; arm64 = 'unknown' }
            records = @()
          }
          try {
            if ([string]::IsNullOrWhiteSpace($env:GITHUB_WORKSPACE) -or
                -not [IO.Path]::IsPathFullyQualified($env:GITHUB_WORKSPACE)) { throw 'Workspace unavailable' }
            $candidate = [IO.Path]::GetFullPath([IO.Path]::Combine($env:GITHUB_WORKSPACE, 'dist', 'threadnote.exe'))
            $sourceBunPath = $null
            $metadataPathCandidate = $null
            $metadataProcess = $null
            $metadataStarted = $false
            $metadataClock = $null
            $stdoutReader = $null
            $stderrReader = $null
            $stdoutStream = $null
            $stderrStream = $null
            $stdoutRead = $null
            $stderrRead = $null
            $exitTask = $null
            try {
              $bunCommand = Get-Command bun -CommandType Application -ErrorAction Stop
              $bunExecutable = [string]$bunCommand.Source
              if ([IO.Path]::GetExtension($bunExecutable) -ine '.exe') { throw 'Bun executable unavailable' }
              $metadataInfo = [Diagnostics.ProcessStartInfo]::new($bunExecutable)
              $metadataInfo.UseShellExecute = $false
              $metadataInfo.CreateNoWindow = $true
              $metadataInfo.RedirectStandardOutput = $true
              $metadataInfo.RedirectStandardError = $true
              $metadataInfo.ArgumentList.Add('-e')
              $metadataInfo.ArgumentList.Add('process.stdout.write(process.execPath)')
              $metadataProcess = [Diagnostics.Process]::new()
              $metadataProcess.StartInfo = $metadataInfo
              $metadataClock = [Diagnostics.Stopwatch]::StartNew()
              $metadataStarted = $metadataProcess.Start()
              if ($metadataStarted) {
                $stdoutReader = $metadataProcess.StandardOutput
                $stderrReader = $metadataProcess.StandardError
                $stdoutStream = $stdoutReader.BaseStream
                $stderrStream = $stderrReader.BaseStream
                $stdoutBuffer = [byte[]]::new(512)
                $stderrBuffer = [byte[]]::new(512)
                $stdoutBytes = [Collections.Generic.List[byte]]::new()
                $stdoutRead = $stdoutStream.ReadAsync($stdoutBuffer, 0, $stdoutBuffer.Length)
                $stderrRead = $stderrStream.ReadAsync($stderrBuffer, 0, $stderrBuffer.Length)
                $exitTask = $metadataProcess.WaitForExitAsync()
                $stdoutEof = $false
                $stderrEof = $false
                $stdoutTooLong = $false
                while (-not ($stdoutEof -and $stderrEof -and $exitTask.IsCompleted)) {
                  $remainingWork = 3000 - [int]$metadataClock.ElapsedMilliseconds
                  if ($remainingWork -le 0) { break }
                  $pendingReads = [Collections.Generic.List[Threading.Tasks.Task]]::new()
                  if (-not $stdoutEof) { $pendingReads.Add($stdoutRead) }
                  if (-not $stderrEof) { $pendingReads.Add($stderrRead) }
                  if (-not $exitTask.IsCompleted) { $pendingReads.Add($exitTask) }
                  $nextTask = [Threading.Tasks.Task]::WhenAny([Threading.Tasks.Task[]]$pendingReads.ToArray())
                  if (-not $nextTask.Wait($remainingWork)) { break }
                  $completedTask = $nextTask.Result
                  if (-not $stdoutEof -and [object]::ReferenceEquals($completedTask, $stdoutRead)) {
                    $readBytes = $stdoutRead.Result
                    if ($readBytes -eq 0) { $stdoutEof = $true }
                    else {
                      $captureBytes = [Math]::Min($readBytes, 2049 - $stdoutBytes.Count)
                      for ($index = 0; $index -lt $captureBytes; $index++) { $stdoutBytes.Add($stdoutBuffer[$index]) }
                      if ($captureBytes -lt $readBytes -or $stdoutBytes.Count -gt 2048) { $stdoutTooLong = $true }
                      $stdoutRead = $stdoutStream.ReadAsync($stdoutBuffer, 0, $stdoutBuffer.Length)
                    }
                  } elseif (-not $stderrEof -and [object]::ReferenceEquals($completedTask, $stderrRead)) {
                    if ($stderrRead.Result -eq 0) { $stderrEof = $true }
                    else { $stderrRead = $stderrStream.ReadAsync($stderrBuffer, 0, $stderrBuffer.Length) }
                  }
                }
                if ($metadataProcess.HasExited -and $stdoutEof -and $stderrEof -and -not $stdoutTooLong -and
                    $metadataProcess.ExitCode -eq 0) {
                  $reportedBunPath = [Text.Encoding]::UTF8.GetString($stdoutBytes.ToArray()).Trim()
                  if ($reportedBunPath.Length -le 2048 -and [IO.Path]::IsPathFullyQualified($reportedBunPath) -and
                      [IO.File]::Exists($reportedBunPath)) {
                    $metadataPathCandidate = [IO.Path]::GetFullPath($reportedBunPath)
                  }
                }
              }
            } catch { $summary.sourceBunResolved = $false } finally {
              $cleanupComplete = $true
              if ($metadataStarted) {
                try {
                  if (-not $metadataProcess.HasExited) { try { $metadataProcess.Kill() } catch { } }
                } catch { $cleanupComplete = $false }
              }
              foreach ($reader in @($stdoutReader, $stderrReader)) {
                if ($reader) { try { $reader.Dispose() } catch { $cleanupComplete = $false } }
              }
              $childExited = -not $metadataStarted
              if ($metadataStarted) {
                try {
                  $remainingChildWait = [Math]::Min(1000, [Math]::Max(0, 5000 - [int]$metadataClock.ElapsedMilliseconds))
                  if ($remainingChildWait -gt 0) { [void]$metadataProcess.WaitForExit($remainingChildWait) }
                  $childExited = $metadataProcess.HasExited
                  if (-not $childExited) { $cleanupComplete = $false }
                } catch { $cleanupComplete = $false }
              }
              $pendingTasks = [Collections.Generic.List[Threading.Tasks.Task]]::new()
              foreach ($pendingRead in @($stdoutRead, $stderrRead, $exitTask)) {
                if ($pendingRead) { $pendingTasks.Add($pendingRead) }
              }
              if ($pendingTasks.Count -gt 0) {
                $settledReads = [Threading.Tasks.Task]::WhenAll([Threading.Tasks.Task[]]$pendingTasks.ToArray())
                $remainingReadWait = [Math]::Max(0, 5000 - [int]$metadataClock.ElapsedMilliseconds)
                if ($remainingReadWait -gt 0) { try { [void]$settledReads.Wait($remainingReadWait) } catch { } }
                foreach ($pendingRead in $pendingTasks) {
                  try {
                    if ($pendingRead.IsCompleted) { $null = $pendingRead.GetAwaiter().GetResult() }
                    else { $cleanupComplete = $false }
                  } catch { $cleanupComplete = $false }
                }
              }
              if ($metadataStarted) {
                try { $childExited = $metadataProcess.HasExited } catch { $childExited = $false }
                if (-not $childExited) { $cleanupComplete = $false }
              }
              if ($metadataProcess) { try { $metadataProcess.Dispose() } catch { $cleanupComplete = $false } }
              if ($metadataPathCandidate -and $cleanupComplete -and $childExited) {
                $sourceBunPath = $metadataPathCandidate
                $summary.sourceBunResolved = $true
              } else { $summary.sourceBunResolved = $false }
            }
            $allowedAppPaths = [Collections.Generic.Dictionary[string, string]]::new([StringComparer]::OrdinalIgnoreCase)
            $allowedAppPaths[$candidate] = 'candidate'
            if ($sourceBunPath -and -not $allowedAppPaths.ContainsKey($sourceBunPath)) {
              $allowedAppPaths[$sourceBunPath] = 'source-bun'
            }
            $now = [DateTime]::UtcNow
            $crashEvents = @(Get-WinEvent -FilterHashtable @{
              LogName = 'Application'; ProviderName = 'Application Error'; Id = 1000
              StartTime = $now.AddSeconds(-180); EndTime = $now; AppPath = [string[]]$allowedAppPaths.Keys
            } -MaxEvents 32 -ErrorAction Stop)
            $summary.queryLimitReached = $crashEvents.Count -eq 32
            $records = [Collections.Generic.List[object]]::new()
            foreach ($crashEvent in $crashEvents) {
              try {
                $xmlText = $crashEvent.ToXml()
                if ($xmlText.Length -gt 65536) { continue }
                $fields = @{}
                foreach ($field in ([xml]$xmlText).Event.EventData.Data) {
                  $fieldName = $field.GetAttribute('Name')
                  if ($fieldName) { $fields[$fieldName] = [string]$field.InnerText }
                }
                if (-not [IO.Path]::IsPathFullyQualified([string]$fields.AppPath)) { continue }
                $eventAppPath = [IO.Path]::GetFullPath([string]$fields.AppPath)
                if (-not $allowedAppPaths.ContainsKey($eventAppPath)) { continue }
                $module = [IO.Path]::GetFileName([string]$fields.ModuleName)
                $exceptionCode = [string]$fields.ExceptionCode
                $faultOffset = [string]$fields.FaultingOffset
                if ($module -notmatch '^[A-Za-z0-9_.-]{1,128}$' -or
                    $exceptionCode -notmatch '^(?:0x)?[A-Fa-f0-9]{8}$' -or
                    $faultOffset -notmatch '^(?:0x)?[A-Fa-f0-9]{1,16}$' -or $null -eq $crashEvent.TimeCreated) { continue }
                $processText = [string]$fields.ProcessId
                $crashPid = [uint32]0
                if ($processText -match '^0x([A-Fa-f0-9]{1,8})$') { $crashPid = [Convert]::ToUInt32($Matches[1], 16) }
                elseif ($processText -notmatch '^[0-9]{1,10}$' -or -not [uint32]::TryParse($processText, [ref]$crashPid)) { continue }
                if ($crashPid -eq 0) { continue }
                $records.Add(@{
                  appKind = $allowedAppPaths[$eventAppPath]
                  module = $module; exceptionCode = '0x' + ($exceptionCode -replace '^0x', '').ToLowerInvariant()
                  offset = '0x' + ($faultOffset -replace '^0x', '').ToLowerInvariant(); processId = $crashPid
                  timeUtc = $crashEvent.TimeCreated.ToUniversalTime().ToString('o')
                })
                if ($records.Count -eq 4) { break }
              } catch { continue }
            }
            $summary.records = @($records.ToArray())
            if ($records.Count -gt 0) { $summary.status = 'observed' }
          } catch { $summary.status = 'unknown' }
          try {
            $programFiles = [Environment]::GetFolderPath('ProgramFiles')
            $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
            $debuggerPaths = @()
            if ($programFiles) { $debuggerPaths += [IO.Path]::Combine($programFiles, 'Windows Kits', '10', 'Debuggers', 'arm64', 'cdb.exe') }
            if ($programFilesX86) { $debuggerPaths += [IO.Path]::Combine($programFilesX86, 'Windows Kits', '10', 'Debuggers', 'arm64', 'cdb.exe') }
            foreach ($debuggerPath in $debuggerPaths) {
              if ([IO.File]::Exists($debuggerPath)) {
                $summary.cdb.available = $true
                $debuggerInfo = [IO.FileInfo]::new($debuggerPath)
                $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($debuggerPath).FileVersion
                if ($version -match '^[A-Za-z0-9 ._+-]{1,80}$') { $summary.cdb.version = $version }
                if ($debuggerInfo.Length -le 67108864) {
                  $hash = (Get-FileHash -LiteralPath $debuggerPath -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
                  if ($hash -match '^[a-f0-9]{64}$') { $summary.cdb.sha256 = $hash }
                }
                $stream = [IO.File]::OpenRead($debuggerPath)
                try {
                  if ($stream.Length -ge 64) {
                    $reader = [IO.BinaryReader]::new($stream)
                    $stream.Position = 0x3c
                    $peOffset = $reader.ReadInt32()
                    if ($peOffset -ge 0 -and $peOffset -le 1048576 -and $peOffset + 6 -le $stream.Length) {
                      $stream.Position = $peOffset
                      if ($reader.ReadUInt32() -eq 0x00004550) { $summary.cdb.arm64 = $reader.ReadUInt16() -eq 0xAA64 }
                    }
                  }
                } finally { $stream.Dispose() }
                break
              }
            }
          } catch { }
          $encoded = $summary | ConvertTo-Json -Depth 4 -Compress
          if ([Text.Encoding]::UTF8.GetByteCount($encoded) -le 4096) { Write-Output $encoded }
          else { Write-Output '{"version":1,"status":"unknown"}' }
          exit 0
      - name: Preserve bounded self-contained smoke failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: self-contained-smoke-evidence-${{ inputs.target }}
          path: .context/self-contained-smoke/failure.json
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Archive the native release
        run: bun run archive:release
        env:
          THREADNOTE_RELEASE_TARGET: ${{ inputs.target }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: native-container-failure-${{ inputs.target }}
          path: .context/native-inference-container/*-failure.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: native-release-${{ inputs.target }}
          path: artifacts/threadnote-${{ inputs.target }}.tar.gz*
          if-no-files-found: error
      # Consumers below qualify the archive exactly as published, so the build tree is replaced by it.
      - name: Restore the verified native payload
        id: restore
        shell: bash
        run: |
          # Linux payloads are built in a root container; return the workspace to the runner user.
          if [ "$RUNNER_OS" = Linux ]; then sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"; fi
          rm -rf dist
          mkdir -p dist
          tar -xzf artifacts/threadnote-${{ inputs.target }}.tar.gz -C dist
      - name: Real predecessor upgrade and model setup admission
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && inputs.runner == 'macos-15' }}
        env:
          GH_TOKEN: ${{ github.token }}
          THREADNOTE_QUALIFY_OLD_UPGRADE: ephemeral-macos-real-predecessor
          THREADNOTE_UPGRADE_RECEIPT_DIR: ${{ runner.temp }}/threadnote-upgrade-receipts
        run: |
          test "$THREADNOTE_QUALIFY_OLD_UPGRADE" = ephemeral-macos-real-predecessor
          predecessor_root="$(mktemp -d "$RUNNER_TEMP/threadnote-beta4.XXXXXX")"
          chmod 700 "$predecessor_root"
          mkdir -p "$THREADNOTE_UPGRADE_RECEIPT_DIR"
          gh api repos/threadnote/threadnote/releases/tags/v5.3.0-beta.4 > "$THREADNOTE_UPGRADE_RECEIPT_DIR/predecessor-release-api.json"
          jq -e '.immutable == true and .draft == false and .tag_name == "v5.3.0-beta.4"' "$THREADNOTE_UPGRADE_RECEIPT_DIR/predecessor-release-api.json"
          gh release download v5.3.0-beta.4 --repo threadnote/threadnote --pattern threadnote-darwin-arm64.tar.gz --dir "$predecessor_root"
          THREADNOTE_OLD_RELEASE_ARCHIVE="$predecessor_root/threadnote-darwin-arm64.tar.gz" \
          THREADNOTE_OLD_RELEASE_METADATA="$THREADNOTE_UPGRADE_RECEIPT_DIR/predecessor-release-api.json" \
            bun --bun vitest run --config vitest.e2e.config.ts apps/threadnote/test/e2e/model-setup-upgrade.e2e.ts
      - name: Preserve predecessor upgrade receipts
        if: always() && inputs.runner == 'macos-15'
        uses: actions/upload-artifact@v7
        with:
          name: model-setup-predecessor-upgrade
          path: ${{ runner.temp }}/threadnote-upgrade-receipts
          if-no-files-found: error
      - name: Installed release E2E
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && !endsWith(inputs.target, '-musl') }}
        run: >-
          bun --bun vitest run --config vitest.e2e.config.ts
          --reporter=default --reporter=json --outputFile=.context/installed-e2e/results.json
      - name: Preserve installed E2E timings
        if: ${{ always() && !endsWith(inputs.target, '-musl') }}
        uses: actions/upload-artifact@v7
        with:
          name: installed-e2e-${{ inputs.target }}
          path: .context/installed-e2e/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Extracted release and installed workflow lifecycle
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && !endsWith(inputs.target, '-musl') }}
        run: >-
          bun --bun vitest run apps/threadnote/test/dev-skills/release-artifact.test.ts
          --reporter=default --reporter=json --outputFile=.context/release-artifact/timings.json
        env:
          THREADNOTE_RELEASE_ARCHIVE: artifacts/threadnote-${{ inputs.target }}.tar.gz
          THREADNOTE_RELEASE_PROFILE: ${{ inputs.runner == 'macos-15-intel' && 'desktop' || 'all' }}
      - name: Workflow journal persistence smoke
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && !endsWith(inputs.target, '-musl') }}
        run: bun --bun vitest run apps/threadnote/test/dev-skills/workflow-journal-validation.test.ts
      - name: Extracted musl release and installed workflow lifecycle
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && endsWith(inputs.target, '-musl') }}
        run: >-
          bun scripts/assemble-native-inference.ts --musl-container --workflow-runtime
          --container-command-json '["bash","-ec","set -euo pipefail; command -v git; command -v rg; command -v bwrap; test -s .context/release-artifact/capabilities.json; bun --bun vitest run apps/threadnote/test/dev-skills/release-artifact.test.ts --reporter=default --reporter=json --outputFile=.context/release-artifact/timings.json; bun --bun vitest run apps/threadnote/test/dev-skills/workflow-journal-validation.test.ts"]'
        env:
          THREADNOTE_RELEASE_ARCHIVE: artifacts/threadnote-${{ inputs.target }}.tar.gz
          THREADNOTE_RELEASE_PROFILE: ${{ inputs.runner == 'macos-15-intel' && 'desktop' || 'all' }}
      - name: Preserve bounded release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dev-skills-release-${{ inputs.target }}-${{ inputs.runner == 'macos-15-intel' && 'desktop' || 'all' }}
          path: .context/release-artifact/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Remove owned Linux temporary storage
        if: always() && runner.os == 'Linux' && env.THREADNOTE_CI_TEST_TMPDIR != ''
        shell: bash
        run: |
          bun --eval 'import {lstatSync,realpathSync,rmSync} from "node:fs";
          const root=Bun.env.THREADNOTE_CI_TEST_TMPDIR;
          if(!/^\/tmp\/threadnote-ci-[A-Za-z0-9]+$/.test(root)||realpathSync(root)!==root)throw new Error("Owned CI temporary root changed");
          const stat=lstatSync(root); if(!stat.isDirectory()||stat.uid!==process.getuid()||(stat.mode&0o077)!==0)throw new Error("Owned CI temporary root changed");
          rmSync(root,{recursive:true});'

  # macOS Intel splits its catalog profiles so the slowest host keeps a short critical path.
  extracted-workflows:
    name: Extracted workflows · ${{ matrix.profile }}
    if: inputs.runner == 'macos-15-intel'
    needs: build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: ['cursor-cloud-personal']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Route Bun caches outside the source checkout
        shell: bash
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/threadnote-bun-install
          BUN_RUNTIME_TRANSPILER_CACHE_PATH: ${{ runner.temp }}/threadnote-bun-transpiler
        run: |
          printf '%s\n' "BUN_INSTALL_CACHE_DIR=$BUN_INSTALL_CACHE_DIR" >> "$GITHUB_ENV"
          printf '%s\n' "BUN_RUNTIME_TRANSPILER_CACHE_PATH=$BUN_RUNTIME_TRANSPILER_CACHE_PATH" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: macOS workflow prerequisites
        run: command -v rg || brew install ripgrep
      - uses: actions/download-artifact@v8
        with:
          name: native-release-${{ inputs.target }}
          path: artifacts
      - name: Restore the verified native payload
        shell: bash
        run: |
          mkdir -p dist
          tar -xzf artifacts/threadnote-${{ inputs.target }}.tar.gz -C dist
      - name: Extracted release and installed workflow lifecycle
        run: >-
          bun --bun vitest run apps/threadnote/test/dev-skills/release-artifact.test.ts
          --reporter=default --reporter=json --outputFile=.context/release-artifact/timings.json
        env:
          THREADNOTE_RELEASE_ARCHIVE: artifacts/threadnote-${{ inputs.target }}.tar.gz
          THREADNOTE_RELEASE_PROFILE: ${{ matrix.profile }}
      - name: Preserve bounded release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dev-skills-release-${{ inputs.target }}-${{ matrix.profile }}
          path: .context/release-artifact/
          include-hidden-files: true
          if-no-files-found: ignore

  musl-native:
    name: Native musl binary and ownership · ${{ inputs.target }}
    if: endsWith(inputs.target, '-musl')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Build and execute in native musl userspace
        shell: bash
        env:
          RELEASE_TARGET: ${{ inputs.target }}
          # Official oven/bun1.4.4 Alpine index; both native amd64/arm64 manifests verified.
          MUSL_IMAGE: oven/bun:1.4.4-alpine@sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a
        run: |
          set -euo pipefail
          case "$RELEASE_TARGET" in
            linux-x64-musl) test "$(uname -m)" = x86_64; THREADNOTE_BUILD_TARGET=bun-linux-x64-baseline-musl ;;
            linux-arm64-musl) test "$(uname -m)" = aarch64; THREADNOTE_BUILD_TARGET=bun-linux-arm64-musl ;;
            *) exit 1 ;;
          esac
          export THREADNOTE_BUILD_TARGET
          mkdir -p .context/semantic-platform
          docker pull "$MUSL_IMAGE"
          docker image inspect "$MUSL_IMAGE" > .context/semantic-platform/image.json
          # A /tmp mount cannot repair an OverlayFS process root: native ownership
          # proof starts at literal /. Use the runner filesystem only after admission,
          # avoiding a second filesystem image/loop device or a memory-sized tmpfs root.
          rootfs="$(mktemp -d "$RUNNER_TEMP/threadnote-musl-root.XXXXXX")"
          readonly rootfs
          image_container=''
          cleanup() {
            status=$?
            trap - EXIT
            cleanup_failed=0
            for target in proc dev workspace; do
              if mountpoint -q "$rootfs/$target"; then
                sudo umount "$rootfs/$target" || cleanup_failed=1
              fi
            done
            # Never traverse a surviving workspace bind mount during deletion.
            if test "$cleanup_failed" -eq 0; then
              sudo rm -rf -- "$rootfs"
            else
              echo 'Musl root cleanup left a mounted job-owned root; refusing deletion.' >&2
              status=1
            fi
            if test -n "$image_container"; then
              docker rm "$image_container" || status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          root_magic="$(stat --file-system --format=%t "$rootfs")"
          case "$root_magic" in ef53|58465342|9123683e|1021994) ;; *) echo "Unsupported musl root filesystem: $root_magic" >&2; exit 1 ;; esac
          root_options="$(findmnt --noheadings --output OPTIONS --target "$rootfs")"
          case ",$root_options," in *,ro,*) echo 'Read-only musl root filesystem.' >&2; exit 1 ;; esac
          printf '{"filesystemMagic":"0x%s","readOnly":false}\n' "$root_magic" > .context/semantic-platform/root-filesystem-host.json
          image_id="$(docker image inspect --format '{{.Id}}' "$MUSL_IMAGE")"
          image_container="$(docker create --user root "$image_id")"
          docker inspect "$image_container" > .context/semantic-platform/root-container.json
          docker export "$image_container" | sudo tar --extract --preserve-permissions --file=- --directory="$rootfs"
          sudo chown root:root "$rootfs"
          sudo chmod 0755 "$rootfs"
          for target in etc dev proc workspace root; do
            test ! -L "$rootfs/$target"
            sudo mkdir -p "$rootfs/$target"
          done
          sudo chmod 0700 "$rootfs/root"
          sudo rm -f -- "$rootfs/etc/resolv.conf"
          sudo cp -L /etc/resolv.conf "$rootfs/etc/resolv.conf"
          sudo mount --bind "$PWD" "$rootfs/workspace"
          sudo mount --bind /dev "$rootfs/dev"
          # Match the former container isolation: namespace exit kills its children,
          # and its /proc mount disappears before outer bind-mount cleanup.
          sudo unshare --mount --pid --fork --kill-child --mount-proc="$rootfs/proc" chroot "$rootfs" /usr/bin/env -i HOME=/root PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin THREADNOTE_BUILD_TARGET="$THREADNOTE_BUILD_TARGET" RELEASE_TARGET="$RELEASE_TARGET" sh -se <<'MUSL'
              cd /workspace
              test "$(id -u)" -eq 0
              test "$HOME" = /root
              apk add --no-cache bash git ripgrep bubblewrap libstdc++ libgcc acl
              bun --version > .context/semantic-platform/bun-version.txt
              uname -m > .context/semantic-platform/architecture.txt
              apk info -v > .context/semantic-platform/system-packages.txt
              ldd /usr/local/bin/bun > .context/semantic-platform/bun-libraries.txt 2>&1
              git config --global --add safe.directory /workspace
              # Reproduce root prepare explicitly: the pinned Effect Oxlint replacement does not support musl.
              bun install --frozen-lockfile --ignore-scripts
              bun --bun husky
              bun --bun effect-tsgo patch --no-typescript --oxlint --skip-missing
              printf '%s\n' 'Effect Oxlint integration: unsupported on musl; no lint run or pass is claimed.' > .context/semantic-platform/effect-lint-status.txt
              bun --eval 'import {runtimeNativePlatformTarget,runtimeNativePlatformSupport} from "@threadnote/platform/system"; const support=runtimeNativePlatformSupport(); if(!support.writer||!support.providerTree)throw new Error("Native semantic platform capability unavailable"); const actual=runtimeNativePlatformTarget(); const expected=Bun.env.THREADNOTE_BUILD_TARGET.slice(4); if(actual!==expected)throw new Error(`Native libc/CPU target mismatch: ${actual} != ${expected}`); console.log(actual);' > .context/semantic-platform/native-target.txt
              private_tmp="$(mktemp -d /tmp/threadnote-ci-XXXXXX)"
              export TMPDIR="$private_tmp"
              trap 'rm -rf -- "$private_tmp"' EXIT
              bun --eval 'import {statfsSync,statSync} from "node:fs"; const allowed=new Set([0xef53,0x58465342,0x9123683e,0x01021994]); const paths=["/","/workspace",Bun.env.HOME,Bun.env.TMPDIR]; const observations=paths.map(path=>({role:path==="/"?"root":path==="/workspace"?"workspace":path===Bun.env.HOME?"home":"private-temp",filesystemType:statfsSync(path).type,ownerUid:statSync(path).uid,mode:statSync(path).mode&0o7777})); console.log(JSON.stringify(observations)); if(observations.some(item=>!allowed.has(item.filesystemType)))throw new Error("Unsupported musl qualification filesystem");' > .context/semantic-platform/private-temp-filesystem.json
              # Prove real default-ACL xattrs before the unchanged native negative test.
              acl_probe="$(mktemp -d "$private_tmp/acl-preflight.XXXXXX")"
              chmod 0700 "$acl_probe"
              setfacl -m d:u::rwx,d:g::---,d:o::--- "$acl_probe"
              test "$(stat -c %a "$acl_probe")" = 700
              getfacl -cp "$acl_probe" > .context/semantic-platform/default-acl-preflight.txt
              grep -Fx 'default:user::rwx' .context/semantic-platform/default-acl-preflight.txt
              grep -Fx 'default:group::---' .context/semantic-platform/default-acl-preflight.txt
              grep -Fx 'default:other::---' .context/semantic-platform/default-acl-preflight.txt
              setfacl -k "$acl_probe"
              getfacl -cp "$acl_probe" > .context/semantic-platform/default-acl-cleared.txt
              test "$(grep -c '^default:' .context/semantic-platform/default-acl-cleared.txt)" -eq 0
              rmdir "$acl_probe"
              # Observe the existing bounded ACL fixture before the strict native proof can abort.
              acl_diagnostic_status=0
              bun --bun vitest run packages/platform/test/writer-system/linux-acl.test.ts -t 'refuses an actual Linux default ACL while the private directory mode remains0700' --testTimeout=30000 --reporter=default --reporter=json --outputFile=.context/semantic-platform/private-acl-diagnostic.json > .context/semantic-platform/private-acl-diagnostic.log 2>&1 || acl_diagnostic_status=$?
              cat .context/semantic-platform/private-acl-diagnostic.log
              printf '{"exitCode":%s}\n' "$acl_diagnostic_status" > .context/semantic-platform/private-acl-diagnostic-status.json
              bun --eval 'import {runtimeOpenPrivateWriterDirectory,runtimeClosePrivateWriterDirectory} from "@threadnote/platform/system"; const handle=runtimeOpenPrivateWriterDirectory(Bun.env.TMPDIR); runtimeClosePrivateWriterDirectory(handle); console.log("Native private musl temporary storage proof passed; production qualification remains false");'
              test "$acl_diagnostic_status" -eq 0
              # Documented explicit skip: the native TypeScript asset is neither provisioned nor qualified for musl, and this
              # env -i userspace has no CI or THREADNOTE_NATIVE_TYPESCRIPT_REQUIRED, so native suites skip with their reason.
              echo '::notice title=Native TypeScript skipped on musl::The native TypeScript asset is not provisioned or qualified in the env -i musl userspace; native TypeScript suites skip with their stated reason.'
              printf '%s\n' 'Native TypeScript: not provisioned or qualified for musl; native TypeScript suites skip with their stated reason and no pass is claimed.' > .context/semantic-platform/native-typescript-status.txt
              bun --bun vitest run packages/platform/test/system-stable-read.test.ts packages/platform/test/writer-system/linux-acl.test.ts packages/platform/test/writer-system/provider-process.test.ts apps/threadnote/test/unit/semantic-runtime.test.ts apps/threadnote/test/unit/semantic-writer-process.test.ts apps/threadnote/test/unit/semantic-operations.test.ts apps/threadnote/test/unit/semantic-mcp-cli.test.ts apps/threadnote/test/unit/semantic-python.test.ts apps/threadnote/test/unit/semantic-go-rust.test.ts apps/threadnote/test/unit/semantic-java-preparation.test.ts --reporter=default --reporter=json --outputFile=.context/semantic-platform/components.json
              # Musl release build, smoke, archive and extracted lifecycle run in the build job
              # through the pinned native musl containers.
          MUSL
      - name: Preserve native musl evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-native-${{ inputs.target }}
          path: .context/semantic-platform/
          include-hidden-files: true
          if-no-files-found: error
