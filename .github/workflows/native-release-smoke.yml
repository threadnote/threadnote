name: Native release smoke

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4

jobs:
  build:
    name: Build native payload
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Linux workflow prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: macOS workflow prerequisites
        if: runner.os == 'macOS'
        run: command -v rg || brew install ripgrep
      - name: Windows workflow prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: bun tools/ci/windows-workflow-prerequisites.ts
      - run: bun run check:self-contained
      - name: Platform process identity smoke
        run: bun --bun vitest run apps/threadnote/test/unit/effect-system.test.ts
      - name: Native workflow foundation smoke
        run: >-
          bun --bun vitest run
          packages/workflow-automations/test/inventory.test.ts
          packages/workflow-automations/test/baseline.test.ts
      - name: Initialize native Windows C toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -property installationPath
          if (!$installation) { throw 'Visual Studio native build tools are required.' }
          Import-Module "$installation\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          $architecture = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'x64' }
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments "-arch=$architecture -host_arch=$architecture"
          foreach ($name in @('PATH','INCLUDE','LIB','LIBPATH','VCToolsInstallDir','WindowsSdkDir','WindowsSDKVersion')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          }
      - name: Install pinned native vector toolchain
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Build native payload
        if: runner.os != 'Linux'
        run: bun run build:release
        env:
          THREADNOTE_BUILD_TARGET: ${{ inputs.target == 'windows-x64' && 'bun-windows-x64-baseline' || format('bun-{0}', inputs.target) }}
      - name: Build GNU payload at the preserved libc floor
        if: runner.os == 'Linux' && !endsWith(inputs.target, '-musl')
        run: >-
          bun scripts/assemble-native-inference.ts --gnu-container
          --container-command-json '["bash", "-ec", "set -euo pipefail; bun run build:release; bun scripts/verify-native-vector-reader.ts --required; export THREADNOTE_NATIVE_VECTOR_READER_REQUIRED=1 THREADNOTE_NATIVE_VECTOR_READER_MANIFEST=\"$PWD/dist/runtime/vector-reader/manifest.json\" THREADNOTE_NATIVE_VECTOR_READER_SOURCE_ROOT=\"$PWD\"; bun --bun vitest run packages/recall/test/unit/native-vector-reader.test.ts packages/recall/test/background-vector-step.test.ts apps/threadnote/test/integration/vector-native-read-boundary.test.ts apps/threadnote/test/unit/vector-index.test.ts apps/threadnote/test/unit/vector-index.eligibility.test.ts packages/recall/test/unit/vector-scope-upgrade.test.ts apps/threadnote/test/unit/recall.mcp-background-refresh.test.ts; bun scripts/smoke-self-contained.ts; bun --bun vitest run --config vitest.e2e.config.ts apps/threadnote/test/e2e/local-bins.e2e.ts -t \"recalls saved memory|loads only the bundled\""]'
      - name: Build musl payload at the preserved libc floor
        if: endsWith(inputs.target, '-musl')
        run: >-
          bun scripts/assemble-native-inference.ts --musl-container
          --container-command-json '["bash", "-ec", "set -euo pipefail; bun run build:release; bun scripts/verify-native-vector-reader.ts --required; export THREADNOTE_NATIVE_VECTOR_READER_REQUIRED=1 THREADNOTE_NATIVE_VECTOR_READER_MANIFEST=\"$PWD/dist/runtime/vector-reader/manifest.json\" THREADNOTE_NATIVE_VECTOR_READER_SOURCE_ROOT=\"$PWD\"; bun --bun vitest run packages/recall/test/unit/native-vector-reader.test.ts packages/recall/test/background-vector-step.test.ts apps/threadnote/test/integration/vector-native-read-boundary.test.ts apps/threadnote/test/unit/vector-index.test.ts apps/threadnote/test/unit/vector-index.eligibility.test.ts packages/recall/test/unit/vector-scope-upgrade.test.ts apps/threadnote/test/unit/recall.mcp-background-refresh.test.ts; bun scripts/smoke-self-contained.ts; bun --bun vitest run --config vitest.e2e.config.ts apps/threadnote/test/e2e/local-bins.e2e.ts -t \"recalls saved memory|loads only the bundled\""]'
      - name: Verify bundled vector reader
        if: runner.os != 'Linux'
        run: bun scripts/verify-native-vector-reader.ts --required
      - name: Exercise Rust through the production ready-read worker
        if: runner.os != 'Linux'
        run: >-
          bun --bun vitest run
          packages/recall/test/unit/native-vector-reader.test.ts
          packages/recall/test/background-vector-step.test.ts
          apps/threadnote/test/integration/vector-native-read-boundary.test.ts
          apps/threadnote/test/unit/vector-index.test.ts
          apps/threadnote/test/unit/vector-index.eligibility.test.ts
          packages/recall/test/unit/vector-scope-upgrade.test.ts
          apps/threadnote/test/unit/recall.mcp-background-refresh.test.ts
        env:
          THREADNOTE_NATIVE_VECTOR_READER_REQUIRED: '1'
          THREADNOTE_NATIVE_VECTOR_READER_MANIFEST: ${{ github.workspace }}/dist/runtime/vector-reader/manifest.json
          THREADNOTE_NATIVE_VECTOR_READER_SOURCE_ROOT: ${{ github.workspace }}
      - name: Self-contained native smoke
        if: runner.os != 'Linux'
        run: bun scripts/smoke-self-contained.ts
      - name: Archive the native release
        run: bun run archive:release
        env:
          THREADNOTE_RELEASE_TARGET: ${{ inputs.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: native-release-${{ inputs.target }}
          path: artifacts/threadnote-${{ inputs.target }}.tar.gz*
          if-no-files-found: error

  installed-e2e:
    if: ${{ !endsWith(inputs.target, '-musl') }}
    name: Installed release E2E
    needs: build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Linux workflow prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: macOS workflow prerequisites
        if: runner.os == 'macOS'
        run: command -v rg || brew install ripgrep
      - name: Windows workflow prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: bun tools/ci/windows-workflow-prerequisites.ts
      - uses: actions/download-artifact@v8
        with:
          name: native-release-${{ inputs.target }}
          path: artifacts
      - name: Restore the verified native payload
        shell: bash
        run: |
          mkdir -p dist
          tar -xzf artifacts/threadnote-${{ inputs.target }}.tar.gz -C dist
      - name: Real predecessor upgrade and model setup admission
        if: inputs.runner == 'macos-15'
        env:
          GH_TOKEN: ${{ github.token }}
          THREADNOTE_QUALIFY_OLD_UPGRADE: ephemeral-macos-real-predecessor
          THREADNOTE_UPGRADE_RECEIPT_DIR: ${{ runner.temp }}/threadnote-upgrade-receipts
        run: |
          test "$THREADNOTE_QUALIFY_OLD_UPGRADE" = ephemeral-macos-real-predecessor
          predecessor_root="$(mktemp -d "$RUNNER_TEMP/threadnote-beta4.XXXXXX")"
          chmod 700 "$predecessor_root"
          mkdir -p "$THREADNOTE_UPGRADE_RECEIPT_DIR"
          gh api repos/threadnote/threadnote/releases/tags/v5.3.0-beta.4 > "$THREADNOTE_UPGRADE_RECEIPT_DIR/predecessor-release-api.json"
          jq -e '.immutable == true and .draft == false and .tag_name == "v5.3.0-beta.4"' "$THREADNOTE_UPGRADE_RECEIPT_DIR/predecessor-release-api.json"
          gh release download v5.3.0-beta.4 --repo threadnote/threadnote --pattern threadnote-darwin-arm64.tar.gz --dir "$predecessor_root"
          THREADNOTE_OLD_RELEASE_ARCHIVE="$predecessor_root/threadnote-darwin-arm64.tar.gz" \
          THREADNOTE_OLD_RELEASE_METADATA="$THREADNOTE_UPGRADE_RECEIPT_DIR/predecessor-release-api.json" \
            bun --bun vitest run --config vitest.e2e.config.ts apps/threadnote/test/e2e/model-setup-upgrade.e2e.ts
      - name: Preserve predecessor upgrade receipts
        if: always() && inputs.runner == 'macos-15'
        uses: actions/upload-artifact@v7
        with:
          name: model-setup-predecessor-upgrade
          path: ${{ runner.temp }}/threadnote-upgrade-receipts
          if-no-files-found: error
      - name: Installed release E2E
        run: >-
          bun --bun vitest run --config vitest.e2e.config.ts
          --reporter=default --reporter=json --outputFile=.context/installed-e2e/results.json
      - name: Preserve installed E2E timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-e2e-${{ inputs.target }}
          path: .context/installed-e2e/
          include-hidden-files: true
          if-no-files-found: ignore

  extracted-workflows:
    name: Extracted workflows · ${{ matrix.profile }}
    needs: build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.runner == 'macos-15-intel' && '["desktop","cursor-cloud-personal"]' || '["all"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Linux workflow prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: macOS workflow prerequisites
        if: runner.os == 'macOS'
        run: command -v rg || brew install ripgrep
      - name: Windows workflow prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: bun tools/ci/windows-workflow-prerequisites.ts
      - uses: actions/download-artifact@v8
        with:
          name: native-release-${{ inputs.target }}
          path: artifacts
      - name: Restore the verified native payload
        shell: bash
        run: |
          mkdir -p dist
          tar -xzf artifacts/threadnote-${{ inputs.target }}.tar.gz -C dist
      - name: Extracted release and installed workflow lifecycle
        if: ${{ !endsWith(inputs.target, '-musl') }}
        run: >-
          bun --bun vitest run apps/threadnote/test/dev-skills/release-artifact.test.ts
          --reporter=default --reporter=json --outputFile=.context/release-artifact/timings.json
        env:
          THREADNOTE_RELEASE_ARCHIVE: artifacts/threadnote-${{ inputs.target }}.tar.gz
          THREADNOTE_RELEASE_PROFILE: ${{ matrix.profile }}
      - name: Workflow journal persistence smoke
        if: ${{ !endsWith(inputs.target, '-musl') && (matrix.profile == 'all' || matrix.profile == 'desktop') }}
        run: bun --bun vitest run apps/threadnote/test/dev-skills/workflow-journal-validation.test.ts
      - name: Extracted musl release and installed workflow lifecycle
        if: endsWith(inputs.target, '-musl')
        run: >-
          bun scripts/assemble-native-inference.ts --musl-container --workflow-runtime
          --container-command-json '["bash","-ec","set -euo pipefail; command -v git; command -v rg; command -v bwrap; bun --bun vitest run apps/threadnote/test/dev-skills/release-artifact.test.ts --reporter=default --reporter=json --outputFile=.context/release-artifact/timings.json; bun --bun vitest run apps/threadnote/test/dev-skills/workflow-journal-validation.test.ts"]'
        env:
          THREADNOTE_RELEASE_ARCHIVE: artifacts/threadnote-${{ inputs.target }}.tar.gz
          THREADNOTE_RELEASE_PROFILE: ${{ matrix.profile }}
      - name: Preserve bounded release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dev-skills-release-${{ inputs.target }}-${{ matrix.profile }}
          path: .context/release-artifact/
          include-hidden-files: true
          if-no-files-found: ignore
