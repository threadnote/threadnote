name: Native release smoke

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4

jobs:
  build:
    name: Build native payload
    if: ${{ !endsWith(inputs.target, '-musl') }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Observe Windows native process and primitive components
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        env:
          SEMANTIC_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          New-Item -ItemType Directory -Force .context/semantic-platform | Out-Null
          bun --eval 'import {mkdirSync,readFileSync,writeFileSync} from "node:fs"; import {createHash} from "node:crypto"; import {release} from "node:os";
          const paths=["packages/platform/src/system.ts","packages/platform/src/writer-system/provider.ts","packages/platform/src/writer-system/provider-windows.ts","packages/platform/src/writer-system/windows-native.ts","packages/platform/src/writer-system/windows-files.ts","packages/platform/test/writer-system/provider-process.test.ts","packages/platform/test/writer-system/windows-native.test.ts",".github/workflows/native-release-smoke.yml"];
          writeFileSync(".context/semantic-platform/windows-source.json",JSON.stringify({version:1,scope:"native-component-observation",sourceCommit:Bun.env.SEMANTIC_SOURCE_COMMIT,os:process.platform,osBuild:release(),architecture:process.arch,bun:Bun.version,productionQualified:false,sourceHashes:Object.fromEntries(paths.map(path=>[path,createHash("sha256").update(readFileSync(path)).digest("hex")]))}));'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun --bun vitest run packages/platform/test/writer-system/provider-process.test.ts packages/platform/test/writer-system/windows-native.test.ts --reporter=default --reporter=json --outputFile=.context/semantic-platform/windows-components.json 2>&1 | Tee-Object -FilePath .context/semantic-platform/windows-components.log
          $semanticComponentExit = $LASTEXITCODE
          @{ version = 1; scope = 'native-component-observation'; exitCode = $semanticComponentExit; productionQualified = $false } | ConvertTo-Json | Set-Content .context/semantic-platform/windows-component-status.json
          exit $semanticComponentExit
      - name: Require native semantic platform capability
        if: ${{ !cancelled() }}
        env:
          EXPECTED_NATIVE_TARGET: ${{ inputs.target == 'linux-x64' && 'linux-x64-baseline' || inputs.target == 'windows-x64' && 'windows-x64-baseline' || inputs.target }}
        run: >-
          bun --eval 'import {runtimeNativePlatformTarget,runtimeNativePlatformSupport} from "@threadnote/platform/system";
          import {mkdirSync,writeFileSync} from "node:fs";
          const actual=runtimeNativePlatformTarget(),support=runtimeNativePlatformSupport();
          mkdirSync(".context/semantic-platform",{recursive:true});
          writeFileSync(".context/semantic-platform/native.json",JSON.stringify({actual,expected:Bun.env.EXPECTED_NATIVE_TARGET,support,productionQualified:false}));
          if(actual!==Bun.env.EXPECTED_NATIVE_TARGET||!support.writer||!support.providerTree)throw new Error("Native semantic platform capability unavailable; qualification blocked");'
      - name: Linux workflow prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify private Linux temporary storage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bun --eval 'import {mkdtempSync,realpathSync,appendFileSync,rmSync} from "node:fs";
          import {runtimeOpenPrivateWriterDirectory,runtimeClosePrivateWriterDirectory} from "@threadnote/platform/system";
          const root=realpathSync(mkdtempSync("/tmp/threadnote-ci-"));
          try { const handle=runtimeOpenPrivateWriterDirectory(root); runtimeClosePrivateWriterDirectory(handle);
          appendFileSync(Bun.env.GITHUB_ENV,"THREADNOTE_CI_TEST_TMPDIR="+root+"\nTMPDIR="+root+"\n");
          console.log("Native private CI temporary storage proof passed; production qualification remains false"); }
          catch { rmSync(root,{recursive:true}); throw new Error("Native private CI temporary storage proof failed"); }'
      - name: macOS workflow prerequisites
        if: runner.os == 'macOS'
        run: command -v rg || brew install ripgrep
      - name: Windows workflow prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: bun tools/ci/windows-workflow-prerequisites.ts
      - run: bun run check:self-contained
      - name: Platform process identity smoke
        run: bun --bun vitest run apps/threadnote/test/unit/effect-system.test.ts
      - name: Native workflow foundation smoke
        run: >-
          bun --bun vitest run
          packages/workflow-automations/test/inventory.test.ts
          packages/workflow-automations/test/baseline.test.ts
      - name: Semantic native ownership and safety components
        run: >-
          bun --bun vitest run
          packages/platform/test/system-stable-read.test.ts
          packages/platform/test/writer-system/linux-acl.test.ts
          packages/platform/test/writer-system/provider-process.test.ts
          apps/threadnote/test/unit/semantic-runtime.test.ts
          apps/threadnote/test/unit/semantic-writer-process.test.ts
          apps/threadnote/test/unit/semantic-operations.test.ts
          apps/threadnote/test/unit/semantic-mcp-cli.test.ts
          apps/threadnote/test/unit/semantic-python.test.ts
          apps/threadnote/test/unit/semantic-go-rust.test.ts
          apps/threadnote/test/unit/semantic-java-preparation.test.ts
          --reporter=default --reporter=json --outputFile=.context/semantic-platform/components.json
      - name: Preserve semantic component evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-components-${{ inputs.target }}
          path: .context/semantic-platform/
          include-hidden-files: true
          if-no-files-found: error
      - name: Build native payload
        run: bun run build
        env:
          THREADNOTE_BUILD_TARGET: ${{ inputs.target == 'linux-x64' && 'bun-linux-x64-baseline' || inputs.target == 'windows-x64' && 'bun-windows-x64-baseline' || format('bun-{0}', inputs.target) }}
      - name: Self-contained native smoke
        run: bun scripts/smoke-self-contained.ts
      - name: Archive the native release
        run: bun run archive:release
        env:
          THREADNOTE_RELEASE_TARGET: ${{ inputs.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: native-release-${{ inputs.target }}
          path: artifacts/threadnote-${{ inputs.target }}.tar.gz*
          if-no-files-found: error
      - name: Remove owned Linux temporary storage
        if: always() && runner.os == 'Linux' && env.THREADNOTE_CI_TEST_TMPDIR != ''
        shell: bash
        run: |
          bun --eval 'import {lstatSync,realpathSync,rmSync} from "node:fs";
          const root=Bun.env.THREADNOTE_CI_TEST_TMPDIR;
          if(!/^\/tmp\/threadnote-ci-[A-Za-z0-9]+$/.test(root)||realpathSync(root)!==root)throw new Error("Owned CI temporary root changed");
          const stat=lstatSync(root); if(!stat.isDirectory()||stat.uid!==process.getuid()||(stat.mode&0o077)!==0)throw new Error("Owned CI temporary root changed");
          rmSync(root,{recursive:true});'

  installed-e2e:
    name: Installed release E2E
    if: ${{ !endsWith(inputs.target, '-musl') }}
    needs: build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Linux workflow prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: macOS workflow prerequisites
        if: runner.os == 'macOS'
        run: command -v rg || brew install ripgrep
      - name: Windows workflow prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: bun tools/ci/windows-workflow-prerequisites.ts
      - uses: actions/download-artifact@v8
        with:
          name: native-release-${{ inputs.target }}
          path: artifacts
      - name: Restore the verified native payload
        shell: bash
        run: |
          mkdir -p dist
          tar -xzf artifacts/threadnote-${{ inputs.target }}.tar.gz -C dist
      - name: Real predecessor upgrade and model setup admission
        if: inputs.runner == 'macos-15'
        env:
          GH_TOKEN: ${{ github.token }}
          THREADNOTE_QUALIFY_OLD_UPGRADE: ephemeral-macos-real-predecessor
          THREADNOTE_UPGRADE_RECEIPT_DIR: ${{ runner.temp }}/threadnote-upgrade-receipts
        run: |
          test "$THREADNOTE_QUALIFY_OLD_UPGRADE" = ephemeral-macos-real-predecessor
          predecessor_root="$(mktemp -d "$RUNNER_TEMP/threadnote-beta4.XXXXXX")"
          chmod 700 "$predecessor_root"
          mkdir -p "$THREADNOTE_UPGRADE_RECEIPT_DIR"
          gh api repos/threadnote/threadnote/releases/tags/v5.3.0-beta.4 > "$THREADNOTE_UPGRADE_RECEIPT_DIR/predecessor-release-api.json"
          jq -e '.immutable == true and .draft == false and .tag_name == "v5.3.0-beta.4"' "$THREADNOTE_UPGRADE_RECEIPT_DIR/predecessor-release-api.json"
          gh release download v5.3.0-beta.4 --repo threadnote/threadnote --pattern threadnote-darwin-arm64.tar.gz --dir "$predecessor_root"
          THREADNOTE_OLD_RELEASE_ARCHIVE="$predecessor_root/threadnote-darwin-arm64.tar.gz" \
          THREADNOTE_OLD_RELEASE_METADATA="$THREADNOTE_UPGRADE_RECEIPT_DIR/predecessor-release-api.json" \
            bun --bun vitest run --config vitest.e2e.config.ts apps/threadnote/test/e2e/model-setup-upgrade.e2e.ts
      - name: Preserve predecessor upgrade receipts
        if: always() && inputs.runner == 'macos-15'
        uses: actions/upload-artifact@v7
        with:
          name: model-setup-predecessor-upgrade
          path: ${{ runner.temp }}/threadnote-upgrade-receipts
          if-no-files-found: error
      - name: Installed release E2E
        run: >-
          bun --bun vitest run --config vitest.e2e.config.ts
          --reporter=default --reporter=json --outputFile=.context/installed-e2e/results.json
      - name: Preserve installed E2E timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-e2e-${{ inputs.target }}
          path: .context/installed-e2e/
          include-hidden-files: true
          if-no-files-found: ignore

  extracted-workflows:
    name: Extracted workflows · ${{ matrix.profile }}
    if: ${{ !endsWith(inputs.target, '-musl') }}
    needs: build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.runner == 'macos-15-intel' && '["desktop","cursor-cloud-personal"]' || '["all"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Linux workflow prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: macOS workflow prerequisites
        if: runner.os == 'macOS'
        run: command -v rg || brew install ripgrep
      - name: Windows workflow prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: bun tools/ci/windows-workflow-prerequisites.ts
      - uses: actions/download-artifact@v8
        with:
          name: native-release-${{ inputs.target }}
          path: artifacts
      - name: Restore the verified native payload
        shell: bash
        run: |
          mkdir -p dist
          tar -xzf artifacts/threadnote-${{ inputs.target }}.tar.gz -C dist
      - name: Extracted release and installed workflow lifecycle
        run: >-
          bun --bun vitest run apps/threadnote/test/dev-skills/release-artifact.test.ts
          --reporter=default --reporter=json --outputFile=.context/release-artifact/timings.json
        env:
          THREADNOTE_RELEASE_ARCHIVE: artifacts/threadnote-${{ inputs.target }}.tar.gz
          THREADNOTE_RELEASE_PROFILE: ${{ matrix.profile }}
      - name: Workflow journal persistence smoke
        if: matrix.profile == 'all' || matrix.profile == 'desktop'
        run: bun --bun vitest run apps/threadnote/test/dev-skills/workflow-journal-validation.test.ts
      - name: Preserve bounded release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dev-skills-release-${{ inputs.target }}-${{ matrix.profile }}
          path: .context/release-artifact/
          include-hidden-files: true
          if-no-files-found: ignore

  musl-native:
    name: Native musl binary and ownership · ${{ inputs.target }}
    if: endsWith(inputs.target, '-musl')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Build and execute in native musl userspace
        shell: bash
        env:
          RELEASE_TARGET: ${{ inputs.target }}
          # Official oven/bun1.4.4 Alpine index; both native amd64/arm64 manifests verified.
          MUSL_IMAGE: oven/bun:1.4.4-alpine@sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a
        run: |
          set -euo pipefail
          case "$RELEASE_TARGET" in
            linux-x64-musl) test "$(uname -m)" = x86_64; THREADNOTE_BUILD_TARGET=bun-linux-x64-baseline-musl ;;
            linux-arm64-musl) test "$(uname -m)" = aarch64; THREADNOTE_BUILD_TARGET=bun-linux-arm64-musl ;;
            *) exit 1 ;;
          esac
          export THREADNOTE_BUILD_TARGET
          mkdir -p .context/semantic-platform
          docker pull "$MUSL_IMAGE"
          docker image inspect "$MUSL_IMAGE" > .context/semantic-platform/image.json
          docker run --rm --interactive --init --user root             -v "$PWD:/workspace" -w /workspace             -e THREADNOTE_BUILD_TARGET -e RELEASE_TARGET "$MUSL_IMAGE" sh -se <<'MUSL'
              apk add --no-cache bash git ripgrep bubblewrap libstdc++ libgcc
              bun --version > .context/semantic-platform/bun-version.txt
              uname -m > .context/semantic-platform/architecture.txt
              apk info -v > .context/semantic-platform/system-packages.txt
              ldd /usr/local/bin/bun > .context/semantic-platform/bun-libraries.txt 2>&1
              git config --global --add safe.directory /workspace
              # Reproduce root prepare explicitly: the pinned Effect Oxlint replacement does not support musl.
              bun install --frozen-lockfile --ignore-scripts
              bun --bun husky
              bun --bun effect-tsgo patch --no-typescript --oxlint --skip-missing
              printf '%s\n' 'Effect Oxlint integration: unsupported on musl; no lint run or pass is claimed.' > .context/semantic-platform/effect-lint-status.txt
              bun --eval 'import {runtimeNativePlatformTarget,runtimeNativePlatformSupport} from "@threadnote/platform/system"; const support=runtimeNativePlatformSupport(); if(!support.writer||!support.providerTree)throw new Error("Native semantic platform capability unavailable"); const actual=runtimeNativePlatformTarget(); const expected=Bun.env.THREADNOTE_BUILD_TARGET.slice(4); if(actual!==expected)throw new Error(`Native libc/CPU target mismatch: ${actual} != ${expected}`); console.log(actual);' > .context/semantic-platform/native-target.txt
              private_tmp="$(mktemp -d /tmp/threadnote-ci-XXXXXX)"
              export TMPDIR="$private_tmp"
              trap 'rm -rf -- "$private_tmp"' EXIT
              bun --eval 'import {runtimeOpenPrivateWriterDirectory,runtimeClosePrivateWriterDirectory} from "@threadnote/platform/system"; const handle=runtimeOpenPrivateWriterDirectory(Bun.env.TMPDIR); runtimeClosePrivateWriterDirectory(handle); console.log("Native private musl temporary storage proof passed; production qualification remains false");'
              bun --bun vitest run packages/platform/test/system-stable-read.test.ts packages/platform/test/writer-system/linux-acl.test.ts packages/platform/test/writer-system/provider-process.test.ts apps/threadnote/test/unit/semantic-runtime.test.ts apps/threadnote/test/unit/semantic-writer-process.test.ts apps/threadnote/test/unit/semantic-operations.test.ts apps/threadnote/test/unit/semantic-mcp-cli.test.ts apps/threadnote/test/unit/semantic-python.test.ts apps/threadnote/test/unit/semantic-go-rust.test.ts apps/threadnote/test/unit/semantic-java-preparation.test.ts --reporter=default --reporter=json --outputFile=.context/semantic-platform/components.json
              bun run build
              cp dist/release.json .context/semantic-platform/release.json
              sha256sum dist/threadnote > .context/semantic-platform/binary.sha256
              bun scripts/smoke-self-contained.ts
          MUSL
      - name: Preserve native musl evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-native-${{ inputs.target }}
          path: .context/semantic-platform/
          include-hidden-files: true
          if-no-files-found: error
