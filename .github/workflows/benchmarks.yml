name: Windows ARM64 sampler startup diagnostic

on: workflow_dispatch

permissions:
  contents: read

jobs:
  sampler-diagnostic:
    runs-on: windows-11-arm
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Observe the exact startup stages and both pipe implementations
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD^)
          test "$candidate" = 34957ab177015f1bb90f02c4f85039a2494ea814
          git diff --quiet "$candidate" HEAD -- scripts/windows-process-tree-sampler.ps1
          echo "Sampler source $candidate"
          command -v powershell.exe
          bun -e 'if (process.platform !== "win32" || process.arch !== "arm64") process.exit(1)'
          bun tools/diagnostics/r5-windows-sampler-startup.mjs powershell.exe exact
          node tools/diagnostics/r5-windows-sampler-startup.mjs powershell.exe exact
          bun tools/diagnostics/r5-windows-sampler-startup.mjs powershell.exe minimal
          node tools/diagnostics/r5-windows-sampler-startup.mjs powershell.exe minimal
          if command -v pwsh.exe; then
            bun tools/diagnostics/r5-windows-sampler-startup.mjs pwsh.exe exact
          fi
