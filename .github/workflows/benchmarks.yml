name: Windows ARM64 release sampler proof

on: workflow_dispatch

permissions:
  contents: read

jobs:
  sampler-proof:
    runs-on: windows-11-arm
    timeout-minutes: 10
    env:
      SAMPLER_READY_PROBE: |
        import {Effect, Layer} from 'effect';
        import * as BunServices from '@effect/platform-bun/BunServices';
        import {provideScriptLayer} from './scripts/effect/errors.js';
        import {ScriptSystemInfoLayer} from './scripts/effect/system-layer.js';
        import {makeWindowsProcessTreeSampler} from './scripts/windows-process-tree-sampler.js';
        const probe = Effect.gen(function* () {
          const started = performance.now();
          yield* makeWindowsProcessTreeSampler();
          console.log(JSON.stringify({architecture: process.arch, helperReadyMilliseconds: Math.round(performance.now() - started)}));
        });
        const layer = ScriptSystemInfoLayer.pipe(Layer.provideMerge(BunServices.layer));
        await Effect.runPromise(provideScriptLayer(probe, layer));
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Check out exact candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD^)
          base=$(git rev-parse "$candidate^")
          git checkout --detach "$candidate"
          test "$(git rev-parse HEAD)" = "$candidate"
          test -z "$(git status --porcelain)"
          echo "SAMPLER_CANDIDATE=$candidate" >> "$GITHUB_ENV"
          echo "SAMPLER_BASE=$base" >> "$GITHUB_ENV"
          bun install --frozen-lockfile
          bun -e 'if (process.platform !== "win32" || process.arch !== "arm64") process.exit(1)'
          bun -e 'const shell = Bun.which("pwsh.exe"); if (!shell) process.exit(1); console.log("Resolved PowerShell " + shell)'
      - name: Measure cold startup and exercise exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SAMPLER_CANDIDATE"
          test -z "$(git status --porcelain)"
          echo "Candidate $SAMPLER_CANDIDATE tree $(git rev-parse 'HEAD^{tree}')"
          probe=0
          tests=0
          bun --bun -e "$SAMPLER_READY_PROBE" || probe=$?
          bun --bun vitest run --reporter=verbose apps/threadnote/test/unit/windows-process-tree-sampler.test.ts apps/threadnote/test/integration/code-graph.benchmark-failure.test.ts || tests=$?
          test -z "$(git status --porcelain)"
          echo "Candidate probe exit $probe, tests exit $tests"
          test "$probe" = 0 && test "$tests" = 0
