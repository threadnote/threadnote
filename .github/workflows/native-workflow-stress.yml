name: Windows ARM installed recall diagnostic
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  recall:
    runs-on: windows-11-arm
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        lane: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install the original dependencies and Windows prerequisites
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun tools/ci/windows-workflow-prerequisites.ts
      - name: Download the exact retained release payload
        uses: actions/download-artifact@v8
        with:
          artifact-ids: 14776927205
          github-token: ${{ github.token }}
          run-id: 45078542399
          path: artifacts
          merge-multiple: true
      - name: Verify and unpack the ARM archive
        shell: bash
        run: |
          find artifacts -maxdepth 2 -type f
          (cd artifacts && sha256sum -c threadnote-windows-arm64.tar.gz.sha256)
          mkdir -p dist
          tar -xzf artifacts/threadnote-windows-arm64.tar.gz -C dist
      - name: First fresh installed E2E fixture
        run: bun --bun vitest run --config vitest.e2e.config.ts apps/threadnote/test/e2e/local-bins.e2e.ts --reporter=default
      - name: Second fresh installed E2E fixture
        if: ${{ !cancelled() && hashFiles('dist/threadnote.exe') != '' }}
        run: bun --bun vitest run --config vitest.e2e.config.ts apps/threadnote/test/e2e/local-bins.e2e.ts --reporter=default
