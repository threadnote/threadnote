name: Code graph production ratchet

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-graph-production-ratchet-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.4

jobs:
  # The shared prepared native TypeScript asset for this host: restore, construct once on a miss, save. The ratchet job
  # only restores it, so a cold construction never consumes its 40-minute budget.
  # It runs the ratchet's own scope classifier first, so a diff without production-ratchet paths never pays for a cold
  # construction; a classifier failure fails open exactly as in the ratchet job.
  native-typescript-asset:
    name: Native TypeScript asset · linux-x64
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      cache_key: ${{ steps.asset.outputs.cache_key }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '0'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - id: scope
        name: Classify the production-ratchet diff
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun tools/ci/code-graph-production-ratchet-scope.ts --base "$BASE_SHA" --head "$HEAD_SHA"

      - run: bun install --frozen-lockfile
        if: steps.scope.outcome != 'success' || steps.scope.outputs.run_benchmark != 'false'

      - name: Restore, construct on a miss and save the verified native TypeScript asset
        id: asset
        if: steps.scope.outcome != 'success' || steps.scope.outputs.run_benchmark != 'false'
        timeout-minutes: 80
        uses: ./.github/actions/native-typescript-asset

  ratchet:
    name: Governed reduced production profile · Linux
    needs: native-typescript-asset
    # Runs even when the asset job failed: its restore-only step then fails visibly instead of a skipped check.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '0'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # A classifier failure fails open: the governed benchmark still runs.
      - id: scope
        name: Classify the production-ratchet diff
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun tools/ci/code-graph-production-ratchet-scope.ts --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Record scoped skip
        if: steps.scope.outcome == 'success' && steps.scope.outputs.run_benchmark == 'false'
        run: echo 'Governed benchmark skipped because the diff has no production-ratchet-relevant paths.'

      - run: bun install --frozen-lockfile
        if: steps.scope.outcome != 'success' || steps.scope.outputs.run_benchmark != 'false'

      # The governed profile indexes TypeScript; the candidate and the protected-base control read this one asset.
      - name: Restore the verified native TypeScript asset
        if: steps.scope.outcome != 'success' || steps.scope.outputs.run_benchmark != 'false'
        timeout-minutes: 15
        uses: ./.github/actions/native-typescript-asset
        with:
          restore-only: 'true'
          cache-key: ${{ needs.native-typescript-asset.outputs.cache_key }}

      - name: Measure the governed reduced production profile
        if: steps.scope.outcome != 'success' || steps.scope.outputs.run_benchmark != 'false'
        env:
          THREADNOTE_BENCHMARK_RUNNER_CLASS: github-hosted-ubuntu-24.04-${{ runner.arch }}
          THREADNOTE_BENCHMARK_RUNNER_ID: ${{ runner.name }}
          THREADNOTE_CODE_GRAPH_PARSER_WORKERS: '4'
        run: >-
          bun run bench:code-graph --
          --profile production-large
          --profile-files 3000
          --profile-symbols 110000
          --minimum-free-gib 20
          --samples 1
          --warmups 0
          --quiet
          --output artifacts/code-graph-production-ratchet-Linux-${{ runner.arch }}.json

      - id: static-ratchet
        name: Enforce the reviewed static ratchet
        if: steps.scope.outcome != 'success' || steps.scope.outputs.run_benchmark != 'false'
        continue-on-error: true
        run: >-
          bun tools/ci/code-graph-production-ratchet-gate.ts
          --artifact artifacts/code-graph-production-ratchet-Linux-${{ runner.arch }}.json
          --ratchet apps/threadnote/test/evaluation/baselines/code-graph-v1/production-ratchet-github-linux-x64.json

      # The control runs the protected base against this job's asset, which is verified against the base's own pins.
      # When the base and head disagree on the asset inputs, the control cannot be measured on the same asset: the
      # job fails closed with that reason (the static ratchet failure stands) instead of comparing a degraded control.
      - id: control-asset
        name: Check that the protected base shares the native TypeScript asset inputs
        if: steps.static-ratchet.outcome == 'failure'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- packages/graph/src/typescript_native_asset_pins.ts \
            tools/semantic/build-typescript-native.ts 'tools/semantic/typescript-native-*.patch'; then
            echo 'same=true' >> "$GITHUB_OUTPUT"
          else
            echo 'same=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse a protected-base control with different native TypeScript pins
        if: steps.static-ratchet.outcome == 'failure' && steps.control-asset.outputs.same != 'true'
        run: |
          echo '::error::The static ratchet failed and the protected base pins a different native TypeScript asset, so no same-asset control can confirm a fallback. Rebase onto a base with the same pins or update the reviewed ratchet.'
          exit 1

      - name: Measure the exact protected-base control on the same runner
        if: steps.static-ratchet.outcome == 'failure' && steps.control-asset.outputs.same == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          THREADNOTE_BENCHMARK_RUNNER_CLASS: github-hosted-ubuntu-24.04-${{ runner.arch }}
          THREADNOTE_BENCHMARK_RUNNER_ID: ${{ runner.name }}
          THREADNOTE_CODE_GRAPH_PARSER_WORKERS: '4'
        run: |
          set -euo pipefail
          candidate_root="$GITHUB_WORKSPACE"
          control_root="$RUNNER_TEMP/threadnote-production-ratchet-control"
          git worktree add --detach "$control_root" "$BASE_SHA"
          cd "$control_root"
          bun install --frozen-lockfile
          GITHUB_WORKSPACE="$control_root" GITHUB_SHA="$BASE_SHA" bun run bench:code-graph -- \
            --profile production-large \
            --profile-files 3000 \
            --profile-symbols 110000 \
            --minimum-free-gib 20 \
            --samples 1 \
            --warmups 0 \
            --quiet \
            --output "$candidate_root/artifacts/code-graph-production-ratchet-control-Linux-${{ runner.arch }}.json"

      - name: Remeasure the exact candidate immediately after the control
        if: steps.static-ratchet.outcome == 'failure' && steps.control-asset.outputs.same == 'true'
        env:
          THREADNOTE_BENCHMARK_RUNNER_CLASS: github-hosted-ubuntu-24.04-${{ runner.arch }}
          THREADNOTE_BENCHMARK_RUNNER_ID: ${{ runner.name }}
          THREADNOTE_CODE_GRAPH_PARSER_WORKERS: '4'
        run: >-
          bun run bench:code-graph --
          --profile production-large
          --profile-files 3000
          --profile-symbols 110000
          --minimum-free-gib 20
          --samples 1
          --warmups 0
          --quiet
          --output artifacts/code-graph-production-ratchet-paired-candidate-Linux-${{ runner.arch }}.json

      - name: Enforce same-runner confirmatory fallback with bounded wall tail
        if: steps.static-ratchet.outcome == 'failure' && steps.control-asset.outputs.same == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          bun tools/ci/code-graph-production-ratchet-gate.ts
          --artifact artifacts/code-graph-production-ratchet-paired-candidate-Linux-${{ runner.arch }}.json
          --ratchet apps/threadnote/test/evaluation/baselines/code-graph-v1/production-ratchet-github-linux-x64.json
          --control artifacts/code-graph-production-ratchet-control-Linux-${{ runner.arch }}.json
          --expected-candidate-commit "$GITHUB_SHA"
          --expected-control-commit "$BASE_SHA"
          --initial-candidate artifacts/code-graph-production-ratchet-Linux-${{ runner.arch }}.json

      - uses: actions/upload-artifact@v7
        if: >-
          always() &&
          (steps.scope.outcome != 'success' || steps.scope.outputs.run_benchmark != 'false')
        with:
          name: code-graph-production-ratchet-Linux-${{ runner.arch }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  capture-baseline:
    name: Capture a governed baseline candidate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Capture three exact-source observations and generate a candidate
        env:
          THREADNOTE_BENCHMARK_RUNNER_CLASS: github-hosted-ubuntu-24.04-${{ runner.arch }}
          THREADNOTE_BENCHMARK_RUNNER_ID: ${{ runner.name }}
          THREADNOTE_CODE_GRAPH_PARSER_WORKERS: '4'
        run: |
          set -euo pipefail
          for sample in 1 2 3; do
            bun run bench:code-graph -- \
              --profile production-large --profile-files 3000 --profile-symbols 110000 \
              --minimum-free-gib 20 --samples 1 --warmups 0 --quiet \
              --output "artifacts/production-ratchet-observation-$sample.json"
          done
          bun scripts/generate-code-graph-production-ratchet.ts \
            artifacts/production-ratchet-observation-{1,2,3}.json \
            --output artifacts/production-ratchet-candidate.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-ratchet-candidate-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
