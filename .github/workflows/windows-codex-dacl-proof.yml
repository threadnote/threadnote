name: Isolated Windows Codex diagnostics
on:
  push:
    branches:
      - codex/windows-codex-dacl-diagnostic
permissions:
  contents: read
jobs:
  dacl-fixture:
    name: Verify Codex DACL preservation on 76828a8
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 76828a87fb42fa77a1ad9b69f8f501942fe091f9
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Confirm immutable source and runtime
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne '76828a87fb42fa77a1ad9b69f8f501942fe091f9') { throw "Unexpected source" }
          if ((bun --version) -ne '1.4.4') { throw "Unexpected Bun runtime" }
      - run: bun install --frozen-lockfile
      - name: Run the real Windows DACL and owner preservation test
        shell: pwsh
        run: >-
          bun --bun vitest run --no-file-parallelism --testTimeout=120000
          --config=tools/ci/windows-smoke.config.ts
          apps/threadnote/test/unit/windows-support.test.ts
          -t 'creates and updates a Codex config while preserving the explicit Windows DACL and owner'
